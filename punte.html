            LI=document.getElementById('c-lista'),LR=document.getElementById('c-randuri'),
            NO=document.getElementById('c-nota');
      const st=stareChat(strat);
      // Panoul închis între timp înseamnă că elementele au ieșit din pagină.
      // Fără garda asta, răspunsul lui Socrate ar ateriza în fereastra lui Sky.
      const alMeu=()=>M.isConnected;
      const jos=()=>{M.scrollTop=M.scrollHeight;};
      /* ESCAPAREA E PRIMA, legarea a doua, și ordinea nu e detaliu: invers, o
         adresă scrisă de model ar putea căra marcaj în pagină. Aici linkul se
         culege din text DEJA curățat, deci nu poate conține nici `<`, nici
         ghilimele — și începe cu http, deci nu poate fi `javascript:`.
         Fără legare, linkurile de la SENSORS ar ajunge în chat ca text mort. */
      const corp=s=>esc(s).replace(/\n/g,'<br>').replace(/https?:\/\/[^\s<]+/g,u=>{
        let link=u,coada='';
        // `&quot;` lipit la capăt vine din escapare, nu din adresă.
        const ent=link.match(/(&quot;|&gt;|&#39;)+$/);
        if(ent){coada=ent[0];link=link.slice(0,-coada.length);}
        // Punctul de la capătul propoziției nu face parte din link.
        const p=link.match(/[.,;:!?)\]]+$/);
        if(p){coada=p[0]+coada;link=link.slice(0,-p[0].length);}
        return '<a href="'+link+'" target="_blank" rel="noopener">'+link+'</a>'+coada;});
      const bula=(cls,cine,html)=>{
        const d=document.createElement('div');
        d.className='bula '+cls;
        d.innerHTML='<div class="cine">'+cine+'</div>'+html;
        M.appendChild(d);jos();return d;};
      // Peste prag doar avertizează. Nu taie istoricul și nu blochează
      // trimiterea: cât plătește omul pentru o conversație lungă e decizia lui.
      const contor=()=>{
        const mult=st.tokeni>40000;
        T.textContent=st.tokeni.toLocaleString('ro-RO')+' tokeni';
        T.classList.toggle('mult',mult);
        LG.hidden=!mult;};
      // Ecranul se reconstruiește din `st.istoric`, iar el vine de pe disc,
      // prin server. Pagina nu mai ține o versiune a ei.
      //
      // Firul conține și mesajele de unealtă. Ele nu se arată ca replici: un
      // JSON de 500 de octeți într-o bulă n-ar spune omului nimic. Rămâne doar
      // urma — „a verificat: recon_stare" — ca să știe de unde vin cifrele.
      const reface=()=>{
        M.innerHTML='';
        if(!st.istoric.length)M.innerHTML='<div class="empty">Nicio întrebare încă.</div>';
        else st.istoric.forEach(m=>{
          if(m.role==='tool')return;                       // rezultatul brut, ascuns
          if(m.role==='assistant'&&Array.isArray(m.tool_calls)&&m.tool_calls.length){
            const n=m.tool_calls.map(c=>esc((c.function||{}).name||'?')).join(', ');
            M.insertAdjacentHTML('beforeend','<div class="unealta">a verificat: '+n+'</div>');
            return;}
          if(!m.content)return;                            // bulă goală, nimic de arătat
          bula(m.role==='user'?'om':'voce',m.role==='user'?'Tu':descriere.eticheta,corp(m.content));
        });
        TT.textContent=st.titlu||'Conversație nouă';
        contor();jos();};
      const lock=v=>{
        [B,I].forEach(e=>{e.disabled=v;});
        B.style.opacity=v?'.45':'';B.style.pointerEvents=v?'none':'';};

      // ── Lista conversațiilor ──────────────────────────────────────
      // Lista e un lux; chatul nu depinde de ea. Orice eșec aici se spune
      // într-o notă și se oprește acolo — poți purta o conversație nouă
      // chiar dacă lista n-a apucat să se încarce.
      let conversatii=[];
      const nota=m=>{NO.textContent=m;NO.hidden=!m;};
      const deseneazaLista=()=>{
        if(!conversatii.length){LR.innerHTML='<div class="empty">Nicio conversație încă.</div>';return;}
        LR.innerHTML=conversatii.map(c=>{
          const t=c.titlu||'(fără titlu)';
          // Cifra scurtată, fără cuvântul „tok": textul întreg nu încape în
          // coloană. Vezi scurtTok().
          const meta=(c.cand?stamp(new Date(c.cand)):'—')+' · '+scurtTok(c.tokeni||0);
          return '<div class="conv'+(c.id===st.id?' acum':'')+'" data-id="'+esc(c.id)+'" title="'+esc(t)+'">'
            +'<div class="conv-t">'+esc(t)+'</div>'
            +'<div class="conv-m">'+esc(meta)+'</div>'
            +'<button class="conv-x" title="Șterge conversația">×</button></div>';
        }).join('');};
      const cereLista=()=>{
        fetch('/api/conversatii').then(r=>r.json())
          .then(d=>{
            if(!alMeu())return;
            // Fiecare strat își vede doar firele lui. Lista lui Sky plină de
            // conversații cu Socrate ar fi zgomot: nu le poate continua oricum,
            // fiindcă fiecare fir e legat de stratul cu care a început.
            conversatii=(Array.isArray(d)?d:[]).filter(c=>c.strat===strat);
            nota('');deseneazaLista();})
          .catch(()=>{if(!alMeu())return;
            LR.innerHTML='';nota('Lista nu s-a încărcat. Poți scrie oricum.');});};
      // O singură definiție a lui „fir nou", chemată din două locuri: butonul de
      // aici și ieșirea din cameră. Golirea scrisă de două ori ar fi apucat să
      // difere.
      const goleste=()=>{
        incheieFirul(strat);
        reface();deseneazaLista();};
      const incarca=id=>{
        // Cât stratul scrie, istoricul e la mijlocul unui schimb. Schimbat acum,
        // răspunsul care vine s-ar lipi de altă conversație.
        if(B.disabled)return;
        fetch('/api/conversatii/'+encodeURIComponent(id)).then(r=>r.json()).then(d=>{
          if(!alMeu())return;
          if(!d||!d.ok){nota('Conversația nu s-a putut deschide.');return;}
          const c=d.date||{};
          st.istoric.length=0;(c.mesaje||[]).forEach(m=>st.istoric.push(m));
          st.id=id;st.tokeni=c.tokeni||0;st.titlu=c.titlu||'';
          nota('');reface();deseneazaLista();
          LI.classList.remove('desfasurata');   // sertarul se închide după alegere
          I.focus();
        }).catch(()=>{if(alMeu())nota('Serverul nu răspunde.');});};
      const sterge=id=>{
        fetch('/api/conversatii/'+encodeURIComponent(id),{method:'DELETE'})
          .then(r=>r.json()).then(d=>{
            if(!alMeu())return;
            if(!d||!d.ok){nota('Nu s-a putut șterge.');return;}
            // Ștearsă de pe disc conversația deschisă, ecranul n-o mai poate arăta.
            if(id===st.id)goleste();
            cereLista();
          }).catch(()=>{if(alMeu())nota('Serverul nu răspunde. Nu s-a șters nimic.');});};
      // Un click, o delegare: rândurile se redesenează des, iar ascultătorii
      // puși pe fiecare rând ar trebui refăcuți de fiecare dată.
      LR.onclick=e=>{
        const rand=e.target.closest('.conv');
        if(!rand)return;
        const id=rand.dataset.id;
        // FĂRĂ confirmare, ca `×` din SHIP'S LOG: firul se mută în
        // `date\conversatii-inchise\`, deci se ia înapoi. Regula e una singură în
        // toată puntea: se întreabă acolo unde nu se poate lua înapoi, nu acolo
        // unde se poate.
        if(e.target.closest('.conv-x')){sterge(id);return;}
        incarca(id);};
      document.getElementById('c-lista-btn').onclick=()=>LI.classList.toggle('desfasurata');

      const trimite=()=>{
        const v=I.value.trim();
        if(!v||B.disabled)return;
        /* Adormirea TASTATĂ, aceeași ușă ca cea vorbită: nu pleacă la Sky.
           Altfel ultimul lucru pe care i l-ai scrie ar fi chiar ordinul de a nu
           te mai deranja — plătit, cu un răspuns derutant pe deasupra.

           NUMAI la Sky. La Socrate „stop" e FRÂNA lui, un mesaj adevărat la care
           răspunde; prins aici, i-ar închide panoul în loc să-l oprească din
           întrebat. Vorbit nu se pune problema — urechea e a lui Sky. */
        if(strat==='sky'&&esteAdormire(v)){
          I.value='';
          // Și tastat, camera închisă înseamnă fir încheiat. Chemat aici, nu
          // lăsat pe seama lui closePanel: acolo firul se încheie doar dacă se
          // ieșea din ENGAGE, iar tastatul merge și cu urechea oprită.
          incheieFirul(strat);
          closePanel('disengage tastat');return;}
        M.querySelectorAll('.empty,.bula.rea').forEach(e=>e.remove());
        // Bula apare imediat, dar NU intră în st.istoric: firul îl scrie
        // serverul. Dacă cererea pică, n-avem nimic de dat înapoi.
        const bulaOm=bula('om','Tu',corp(v));
        I.value='';lock(true);
        // Zece secunde de ecran mort par o pană. Indicatorul spune că se lucrează.
        const asteptare=document.createElement('div');
        asteptare.className='scrie';asteptare.textContent=descriere.asteptare;
        M.appendChild(asteptare);jos();

        const cade=m=>{
          // Nimic de curățat din istoric — n-a intrat nimic. Doar bula de pe
          // ecran dispare, iar întrebarea se întoarce în câmp.
          bulaOm.remove();
          I.value=v;
          bula('rea','Eroare',esc(m)+'<div class="nota">Întrebarea a rămas în câmp.</div>');};

        // Steagul e al STĂRII, nu al ecranului: `lock()` dezactivează butoanele
        // panoului, dar panoul poate să nu mai existe — „disengage" închide
        // camera cu replica încă în zbor. Fără el, răspunsul întârziat ar scrie
        // id și istoric peste un fir tocmai încheiat, și conversația următoare
        // ar continua-o pe cea de dinainte.
        st.inZbor=true;
        fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({mesaj:v,strat,id:st.id})})
          .then(r=>r.json())
          .then(d=>{
            // Starea se actualizează chiar dacă panoul s-a închis între timp:
            // firul e al stratului, nu al ferestrei. Doar ecranul se lasă în pace.
            if(!d||!d.ok){if(alMeu()){asteptare.remove();
              cade((d&&d.eroare)||'răspuns necunoscut de la server');}return;}
            const eraNoua=!st.titlu;
            if(d.id)st.id=d.id;
            if(typeof d.tokeni_conversatie==='number')st.tokeni=d.tokeni_conversatie;
            if(typeof d.titlu==='string')st.titlu=d.titlu;
            // Firul se ia întreg de la server, nu se completează local. Aici
            // intră și mesajele de unealtă, pe care pagina nu le-ar fi putut
            // inventa.
            if(Array.isArray(d.mesaje)){st.istoric.length=0;st.istoric.push(...d.mesaje);}
            // Singura unealtă care nu se termină în text, ci într-un gest. Vezi
            // `deschideMuntele`. `reusit!==false`, nu `reusit===true`: însemnarea
            // scrisă de server marchează eșecul explicit, iar o unealtă fără
            // câmpul ăsta a mers.
            if(Array.isArray(d.unelte)&&d.unelte.some(
                 u=>u&&u.nume==='deschide_muntele'&&u.reusit!==false)){
              deschideMuntele();return;}
            if(!alMeu())return;
            asteptare.remove();
            reface();
            // Răspunsul e bun, doar nu s-a scris pe disc. Discret, nu alarmant.
            if(d.avertisment){
              const bule=M.querySelectorAll('.bula.voce');
              if(bule.length)bule[bule.length-1].insertAdjacentHTML(
                'beforeend','<div class="nota">⚠ '+esc(d.avertisment)+'</div>');}
            // Abia acum există pe disc ce să apară în listă. La replicile
            // următoare doar crește cifra tokenilor — se corectează pe loc, că
            // o cerere de rețea pentru un număr pe care îl avem deja e irosită.
            if(eraNoua)cereLista();
            else{
              const c=conversatii.find(c=>c.id===st.id);
              if(c){c.tokeni=st.tokeni;c.mesaje=st.istoric.length;}
              deseneazaLista();}
            jos();})
          .catch(()=>{if(alMeu()){asteptare.remove();cade('serverul JA.S.Mine nu răspunde');}})
          .finally(()=>{
            st.inZbor=false;
            // Camera s-a închis cât răspunsul era pe drum: firul s-a scris pe
            // disc, iar acum se încheie. Ordinea contează — invers, golirea ar
            // fi fost ștearsă de răspuns.
            if(st.incheie)incheieFirul(strat);
            if(alMeu()){lock(false);I.focus();}});};

      I.addEventListener('keydown',e=>{
        if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();trimite();}});
      B.onclick=trimite;
      document.getElementById('c-nou').onclick=()=>{
        if(B.disabled)return;   // nu în timpul unui răspuns în zbor
        goleste();I.focus();};
      reface();cereLista();I.focus();
      if(strat==='sky'){
        URECHE={camp:I,trimite,viu:()=>M.isConnected};
      }
    }};
}

/* ── MUNTELE: clipul ─────────────────────────────────────────────────
   Camera lui Ramana e chatul lui Socrate plus un clip deasupra. Chatul e
   `faChat('ramana')`, neatins — a treia cameră care îl folosește.

   CLIPURILE, în ordinea din `server\munte.json`, în buclă. La fiecare
   deschidere a camerei se reia de la primul: o cameră care continuă de unde ai
   lăsat-o e o cameră despre care trebuie să-ți amintești ceva.

   URECHEA TACE CÂT E CAMERA DESCHISĂ — singura excepție de la „microfonul stă
   deschis cât e JA.S.Mine deschisă": **camera asta face sunet**. Un microfon
   care își aude propriul difuzor transcrie muzică, iar „stop" și „start" se
   caută în tot ce se transcrie. Anularea de ecou a Chrome-ului probabil ar
   ține; „probabil" nu e o cifră.
   Restul punții nu se schimbă: la ieșire urechea se rearmează singură. */
const MUNTE={clipuri:[],volum:.5,lipsesc:0,i:0,video:null,tacut:false,cerut:null,
             ceasVol:null,dinCmd:false};

/* Rama se desenează ÎNAINTE să se știe ce e pe disc: lista vine cu o cerere, iar
   un panou care așteaptă o cerere ca să deseneze ceva e un panou gol în cea mai
   proastă clipă. Ce se poate citi, se citește — titlul și volumul vin din
   `munte.json`, nu sunt tastate aici. */
function htmlClip(){
  return '<div class="munte-clip" id="m-clip">'
    +'<video id="m-video" playsinline preload="auto"></video>'
    +'<div class="munte-semn"><i></i></div>'
    +'<div class="munte-tit" id="m-tit"></div>'
    +'<div class="munte-cmd" id="m-cmd">'
      +'<div class="munte-next" id="m-next" title="Clipul următor"></div>'
      +'<span>VOL</span>'
      +'<input type="range" min="0" max="1" step="0.05" id="m-vol-in" aria-label="Volum">'
    +'</div>'
    +'<div class="munte-fara" id="m-fara" hidden></div>'
  +'</div>';
}

function urmatorulClip(){
  const v=MUNTE.video;if(!v||!MUNTE.clipuri.length)return;
  const c=MUNTE.clipuri[MUNTE.i];
  const t=document.getElementById('m-tit');
  if(t)t.textContent=c.titlu;
  v.src='/munte/'+encodeURIComponent(c.fisier);
  // `play()` întoarce o promisiune care POATE fi refuzată: fereastra deschisă cu
  // vocea n-are niciun gest de om în spate, iar Chrome blochează sunetul fără
  // gest. Kiosk-ul pornește cu `--autoplay-policy=no-user-gesture-required`, dar
  // o plasă costă trei rânduri, iar un clip care nu pornește și nu spune nimic
  // arată exact ca o cameră stricată.
  const pornit=v.play();
  if(pornit&&pornit.catch)pornit.catch(()=>{
    const c=document.getElementById('m-clip');
    if(c)c.classList.add('stat');
    const f=document.getElementById('m-fara');
    if(f){f.hidden=false;f.textContent='Apasă clipul ca să pornească.';}
  });
}

function legClipul(){
  const v=document.getElementById('m-video');
  if(!v)return;
  MUNTE.video=v;MUNTE.i=0;

  // Clipul e suprafața apăsabilă pentru pauză, nu un buton pus în panou: aceeași
  // specie cu un nod sau un minipanou.
  // Buclă: după ultimul, primul. `ended` nu se declanșează pe o eroare de rețea,
  // deci `error` sare mai departe la fel — un clip stricat nu oprește camera.
  // Scrisă aici, deasupra, fiindcă o cheamă și suprafața de skip de mai jos.
  const inainte=()=>{
    if(!MUNTE.clipuri.length)return;
    MUNTE.i=(MUNTE.i+1)%MUNTE.clipuri.length;urmatorulClip();};

  const rama=document.getElementById('m-clip');
  /* Steagul se pune și se ȘTERGE aici, la fiecare `pointerdown` de pe clip — nu
     în `rama.onclick`, care nu rulează deloc când gestul a fost oprit de bară.
     Pus acolo, ar fi rămas agățat pe `true` după orice atingere de volum și ar fi
     înghițit următoarea pauză. Un steag care se pune într-un loc și se șterge în
     altul e adevărat doar pe drumul pe care l-ai încercat. */
  rama.onpointerdown=e=>{
    MUNTE.dinCmd=!!(e.target.closest&&e.target.closest('#m-cmd'));};
  rama.onclick=()=>{
    /* Gestul care a plecat din bara de comenzi NU e o pauză, oricât de sigur ar
       fi browserul că a fost un clic pe clip. Vezi `rama.onpointerdown`. */
    if(MUNTE.dinCmd)return;
    if(!MUNTE.clipuri.length)return;
    const f=document.getElementById('m-fara');
    if(f)f.hidden=true;
    if(v.paused){v.play().catch(()=>{});rama.classList.remove('stat');}
    else{v.pause();rama.classList.add('stat');}
  };
  /* Bara de comenzi. `stopPropagation` pe TOATĂ rama ei, nu doar pe cursor: un
     clic lângă cursor, pe fundalul barei, ar urca la clip și ar pune pauză.

     Atât nu ajunge: la TRAGEREA cursorului de volum, degetul se ridică aproape
     întotdeauna în afara barei, iar browserul emite `click` pe cel mai apropiat
     STRĂMOȘ COMUN al lui `pointerdown` și `pointerup` — adică pe clip. Niciun
     `stopPropagation` de aici nu-l poate opri: se apără la plecare, cu un steag
     pus la `pointerdown`, citit și șters de `rama.onclick`.

     Nu se pierde niciun clic bun: un `pointerdown` pe comenzi urmat de un `click`
     pe clip nu e niciodată un gest de pauză. */
  const RC=document.getElementById('m-cmd'),VI=document.getElementById('m-vol-in');
  RC.onclick=e=>e.stopPropagation();
  /* Clipul următor. A doua suprafață pe clip, ca reglajul de volum — nu un
     control adăugat într-un panou. Titlul nu se schimbă de aici: îl scrie
     `urmatorulClip`, o singură dată. */
  document.getElementById('m-next').onclick=e=>{e.stopPropagation();inainte();};
  VI.oninput=()=>{
    const nou=parseFloat(VI.value);
    v.volume=nou;MUNTE.volum=nou;
    /* Se scrie pe disc DUPĂ ce mâna s-a oprit, nu la fiecare pixel: un `input`
       tras dintr-un capăt în altul dă zeci de evenimente, și fiecare ar fi o
       rescriere de fișier. 400 ms — destul cât să nu se simtă, destul cât să nu
       se scrie de douăzeci de ori. */
    clearTimeout(MUNTE.ceasVol);
    MUNTE.ceasVol=setTimeout(()=>{
      fetch('/api/munte/volum',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({volum:nou})}).catch(()=>{});
    },400);
  };
  v.onplay=()=>rama.classList.remove('stat');
  v.onpause=()=>{if(!v.ended)rama.classList.add('stat');};
  v.onended=inainte;
  v.onerror=inainte;

  // Lista se cere O SINGURĂ DATĂ per fereastră și se ține în MUNTE: fișierele nu
  // apar pe disc cât e puntea deschisă, iar cererea asta ar fi plătită la
  // fiecare deschidere de cameră.
  const gata=()=>{
    v.volume=MUNTE.volum;
    VI.value=MUNTE.volum;
    if(MUNTE.clipuri.length){urmatorulClip();return;}
    const f=document.getElementById('m-fara');
    if(f){f.hidden=false;
      f.innerHTML=MUNTE.lipsesc
        ? 'Clipurile nu sunt pe disc.<br>Se aduc cu <b>py server\\descarca-munte.py</b>.'
        : 'Niciun clip în <b>server\\munte.json</b>.';}
  };
  if(MUNTE.cerut){gata();return;}
  fetch('/api/munte/lista').then(r=>r.json()).then(d=>{
    MUNTE.cerut=true;
    if(d&&Array.isArray(d.clipuri))MUNTE.clipuri=d.clipuri;
    if(d&&typeof d.volum==='number')MUNTE.volum=d.volum;
    if(d&&typeof d.lipsesc==='number')MUNTE.lipsesc=d.lipsesc;
    if(!v.isConnected)return;      // camera s-a închis cât venea lista
    gata();
  }).catch(()=>{
    MUNTE.cerut=true;
    if(!v.isConnected)return;
    const f=document.getElementById('m-fara');
    if(f){f.hidden=false;f.textContent='Nu pot citi lista clipurilor.';}
  });
}

/* Se cheamă din DOUĂ locuri, și amândouă sunt necesare: `arataInSheet` acoperă
   trecerea la alt panou sau la un manual, `closePanel` acoperă Escape, `×` și
   clicul pe hartă. Un `<video>` scos din pagină cu `innerHTML` CONTINUĂ SĂ CÂNTE
   în Chrome — de-aia nu e de ajuns că elementul dispare.

   Idempotentă: chemată de două ori la rând, a doua oară nu face nimic.

   `rearmeaza=false` oprește clipul dar NU repornește urechea, și există pentru
   un singur drum: `Alt+A` apăsat cât ești în munte. Fără el, două porniri de
   ureche pleacă deodată — a mea de aici și a lui `intraInEngage` — fiindcă
   `pornesteUrechea` își pune steagul abia la CAPĂT, deci garda de la intrare le
   lasă pe amândouă să treacă. Rezultatul ar fi două contexte audio pe același
   microfon, adică exact felul de defect care nu se vede: urechea merge, doar
   costă dublu. Se dezleagă din ordine, nu dintr-un zăvor nou. */
function opresteMuntele(rearmeaza){
  const v=MUNTE.video;
  if(v){
    try{v.onended=null;v.onerror=null;v.pause();v.removeAttribute('src');v.load();}catch(e){}
    MUNTE.video=null;
  }
  if(MUNTE.tacut){
    MUNTE.tacut=false;
    jurnalTrezire('munte-reia',rearmeaza===false?'engage':'',null);
    // Idempotentă și ea: iese pe loc dacă urechea e deja pornită.
    if(rearmeaza!==false)armeazaTrezirea();
  }
}

/* Ușa cerută cu gura. Sky a chemat `deschide_muntele`, iar tot mesajul de la
   server către pagină e faptul că unealta a fost chemată — `/api/chat` întoarce
   deja lista în `unelte`. Niciun canal nou.

   Ordinea celor trei rânduri nu e indiferentă:

   1. `ridicaPuntea` ridică NUMAI dacă JA.S.Mine e în bară. O unealtă n-are voie
      să sară peste ce face omul — dar de acolo a chemat-o chiar el, deci n-ar
      avea unde vedea ce a cerut.
   2. Ieșirea din ENGAGE ÎNAINTE de panou, fiindcă ea încheie firul lui Sky. La
      Ramana se scrie, ca la Socrate, iar aici mai e un motiv: acolo cântă un
      clip, deci un microfon deschis ar trimite muzică la Sky, pe bani.
   3. Panoul la urmă. `openPanel` trece prin `arataInSheet`, care oprește orice
      clip vechi și pornește de la primul.

   Se cheamă înaintea gărzii `alMeu()` din `trimite()`: camera trebuie să se
   deschidă și dacă panoul COMMAND s-a închis cât venea răspunsul. */
function deschideMuntele(){
  ridicaPuntea();
  intraInAstept('cerut muntele');
  openPanel('munte');
}

function faMunte(){
  const RAMANA=faChat('ramana');
  return {
    mare:true,
    plin:true,
    html(){return htmlClip()+RAMANA.html();},
    wire(){
      // Urechea tace ÎNAINTE de primul cadru cu sunet, nu după.
      if(!MUNTE.tacut){
        MUNTE.tacut=true;
        jurnalTrezire('munte-tace','',null);
        opresteUrechea('muntele');
        urecheaTace('muntele cântă · Alt+A');
      }
      legClipul();
      RAMANA.wire();
    }};
}

/* ── Dictarea și cuvântul de trezire ─────────────────────────────────
   Vocabularul e de DOUĂ CUVINTE, și nimic altceva de ținut minte:

     „engage"     → Sky pornește: COMMAND se deschide și te ascultă
     („start")    → aceeași ușă ca „engage"
     „disengage"  → Sky se oprește: JA.S.Mine se întoarce la așteptat
     („stop")     → aceeași ușă ca „disengage"

   Cele din paranteze nu sunt cuvinte în plus de ținut minte: sunt a doua cheie
   la aceeași ușă, și fiecare a intrat pe o măsurătoare — regula după care se
   caută fiecare stă la `cautaCuvantul`.

   Deschizi JA.S.Mine și microfonul e deja deschis, în starea AȘTEPT. Acolo fiecare
   rostire se transcrie LOCAL — OpenVINO pe placa integrată, ~0,25 secunde,
   zero tokeni, fără internet — și se caută cuvântul în ea. Nu se trimite nimic
   nicăieri.
   Rostirile mai lungi decât plafonul nici măcar nu se transcriu: un cuvânt de
   trezire e un cuvânt.

   După „engage" ești în ENGAGE: vorbești → taci → fraza pleacă la Sky → urechea
   rămâne deschisă. Tăcerea singură nu declanșează nimic; poți sta un minut pe
   gânduri după răspunsul lui Sky.

   NIMIC nu iese singur din ENGAGE: dacă nu spui nimic, camera rămâne deschisă,
   iar peste o oră poți continua cu altă cerere.

   Alt+A face același lucru ca cele două cuvinte, și rămâne. Nu ca lucru de ținut
   minte, ci ca ușă de rezervă când cuvântul nu se aude sau când iGPU-ul e mort
   și AȘTEPT nu poate porni.

   Ascultarea e permanentă, dar numai cât e JA.S.Mine deschisă, iar proba e
   locală: nu pleacă audio nicăieri și nu costă niciun ban. Cât e în ENGAGE,
   orice se vorbește în cameră ajunge la Sky.

   Fără pictograme, fără butoane. Starea trăiește în nodul COMMAND: textul de
   sub el, particulele care respiră cu vocea, elipsele care se strâng. În AȘTEPT
   particulele TAC — altfel harta ar pulsa toată ziua. */

const U={
  pornita:false, mod:'', stare:'', flux:null, ac:null, nod:null,
  r:null,      // {rec, bucati} — reportofonul curent și vectorul LUI
  // Ce se DESENEAZĂ, hrănit de pe firul audio și citit de rAF în frame().
  // Numărătoarea nu mai trece pe aici; astea două sunt doar pentru ochi.
  nivel:0, strang:0,
  // O singură probă în zbor, plus un loc de așteptare. Vezi `trimiteProba()`.
  probaInZbor:false, probaLaRand:null,
  razg:null, cerere:0, reglaje:null
};

// Implicitele NU sunt configurare: sunt plasa pentru cazul în care
// /api/dictare nu răspunde. Configurarea e în server/dictare.json.
// `trezire` lipsește dinadins: fără server nu se știe după ce cuvânt asculți,
// iar o ureche care ascultă după un cuvânt ghicit e mai rea decât una stinsă.
const U_IMPLICIT={prag_tacere_secunde:3,secunde_razgandire:1,
                  prag_volum:.012,secunde_minim_vorbire:.15,
                  secunde_incredere_vorbire:.4,trezire:null};

/* După atâtea secunde de liniște în care n-ai spus nimic, reportofonul se
   reciclează. Altfel tamponul adună toată pauza dintre replici (32,6 s de audio
   pentru o frază de 2 s), iar Whisper lucrează proporțional și, pe atâta
   liniște, halucinează.

   1,2 s: la 3 s blob-ul purta ~2 s de liniște în față, plătite de procesor.
   Și nu 1,0: o pauză de gândit în mijlocul frazei trece de 1 s, iar începutul
   frazei ar rămâne într-un tampon reciclat.

   Nu e configurabil: e o constantă de mecanism, nu un reglaj care se află
   prin folosire. */
const RECICLARE=1.2;

/* ── Urechea, pe firul audio ─────────────────────────────────────────
   `requestAnimationFrame` se oprește COMPLET cât fereastra e ascunsă, iar
   starea AȘTEPT stă mai tot timpul cu JA.S.Mine în spate. Un AudioWorklet
   rulează pe firul audio, chemat de placa de sunet, nu de compozitorul de
   ferestre: nu-l interesează dacă fereastra se vede.

   Ce face aici: DOAR ceasul și pragurile. Nu înregistrează, nu trimite, nu
   decide. Anunță ce s-a întâmplat — s-a auzit, s-a închis o frază, reciclează,
   închide-te — iar firul principal face restul.

   Pasul se ia din `sampleRate`, nu din 1/60: firul audio n-are cadre, are
   eșantioane.

   `pauza` / `reia`: cât se transcrie sau cât pleacă fraza, tăcerea nu mai
   numără nimic — dar zgomotul tot se adună, altfel vorbirea rostită peste
   transcriere n-ar mai fi vorbire și tamponul ei s-ar recicla.

   `maxim` e plafonul din AȘTEPT: un cuvânt de trezire e un cuvânt. O
   conversație de douăzeci de secunde nu e „engage", iar transcrierea ei ar
   ajunge în jurnalul probelor fără să fi fost vreodată pentru JA.S.Mine. Peste
   plafon, rostirea se taie AICI și nu pleacă nicăieri. În ENGAGE plafonul e 0,
   adică stins: acolo vorbești cât ai de vorbit.

   Se încarcă dintr-un Blob, nu dintr-un fișier: serverul nu servește fișiere
   statice, iar puntea e o singură pagină. */
const URECHE_WORKLET=`
class Ureche extends AudioWorkletProcessor {
  constructor(opt){
    super();
    this.maxim=0;
    this.praguri((opt && opt.processorOptions) || {});
    this.vorbit=false; this.taiat=false;
    this.tTacere=0; this.tCurat=0; this.vorbitSec=0; this.tNivel=0;
    this.tDeschisa=0;
    this.pauzat=false; this.oprit=false;
    this.port.onmessage=e=>{
      const m=e.data;
      if(m==='stop')this.oprit=true;
      else if(m==='pauza')this.pauzat=true;
      else if(m==='reia')this.pauzat=false;
      else if(m && m.praguri)this.praguri(m.praguri);
    };
  }

  praguri(r){
    if(r.prag_volum!=null)this.pragVolum=r.prag_volum;
    if(r.secunde_minim_vorbire!=null)this.minimVorbire=r.secunde_minim_vorbire;
    if(r.prag_tacere!=null)this.pragTacere=r.prag_tacere;
    if(r.reciclare!=null)this.reciclare=r.reciclare;
    if(r.maxim!=null)this.maxim=r.maxim;
  }

  // Nivelul se trimite rar: firul principal îl vrea doar ca să deseneze, iar un
  // mesaj la fiecare 128 de eșantioane ar fi 375 pe secundă pentru un număr.
  raporteaza(nivel,dt){
    this.tNivel+=dt;
    if(this.tNivel<0.05)return;
    this.tNivel=0;
    this.port.postMessage({tip:'nivel', v:nivel,
      strang:this.vorbit ? Math.min(1,this.tTacere/this.pragTacere) : 0});
  }

  process(intrari){
    if(this.oprit)return false;
    const c=intrari[0] && intrari[0][0];
    if(!c)return true;

    let s=0;
    for(let i=0;i<c.length;i++)s+=c[i]*c[i];
    const nivel=Math.sqrt(s/c.length);
    const dt=c.length/sampleRate;
    this.raporteaza(nivel,dt);

    /* NU SE PUNE AICI UN PLAFON PE TIMP SCURS. Când nivelul stă în jurul
       pragului, tăcerea nu ajunge niciodată la pragTacere, ceasul curge, iar
       tăierea cade în mijlocul cuvântului („TAN GEITU.", „And read.").

       Firul audio nu poate ști cât e de lung tamponul — nu el înregistrează.
       Limita stă în firul principal, care ține reportofonul: acolo se
       hotărăște CE SE TRIMITE, nu unde se taie vorbirea.

       ATENȚIE la scris: blocul ăsta trăiește într-un template literal. Un accent
       grav pus aici încheie șirul și rupe TOT scriptul punții — ecran negru. */

    // Vechimea rostirii curge indiferent de zgomot: exact asta lipsea.
    if(this.vorbit)this.tDeschisa+=dt;

    if(nivel>this.pragVolum){
      this.tTacere=0;
      // Vorbirea continuă după plafon. Tamponul se aruncă mai departe, la
      // fiecare RECICLARE: fără asta, o oră de conversație în cameră ar crește
      // în memorie ca să fie aruncată la sfârșit.
      if(this.taiat){
        this.tCurat+=dt;
        if(this.tCurat>=this.reciclare){
          this.tCurat=0;
          this.port.postMessage({tip:'recicleaza'});
        }
        return true;
      }
      this.tCurat=0;
      // Un bloc peste prag nu e o frază: o ușă, o tastă, un oftat trec pragul.
      // Se cere durată cumulată, altfel se trimite zgomot la Whisper și el
      // răspunde cu ce a învățat, nu cu ce s-a auzit.
      this.vorbitSec+=dt;
      if(this.maxim && this.vorbitSec>=this.maxim){
        this.taiat=true; this.vorbit=false; this.tCurat=0; this.tDeschisa=0;
        this.port.postMessage({tip:'prea-lung', secunde:this.vorbitSec});
        return true;
      }
      if(this.vorbitSec>=this.minimVorbire && !this.vorbit){
        this.vorbit=true; this.tDeschisa=0;
        this.port.postMessage({tip:'inceput'});
      }
      return true;
    }

    if(this.pauzat)return true;

    // După o rostire tăiată de plafon nu se închide nimic până nu se lasă
    // liniște: altfel coada frazei ar pleca singură ca rostire nouă.
    if(this.taiat){
      this.tTacere+=dt;
      if(this.tTacere>=this.pragTacere){
        this.taiat=false;
        this.tTacere=0; this.vorbitSec=0; this.tCurat=0; this.tDeschisa=0;
        this.port.postMessage({tip:'recicleaza'});
      }
      return true;
    }

    if(this.vorbit){
      this.tTacere+=dt;
      /* Rostirea se închide fie când s-a lăsat tăcere destulă, fie când e
         DESCHISĂ DE PREA MULT TIMP — dar închiderea pe vechime se face numai
         AICI, în ramura de liniște, unde nu poate tăia nimeni în mijlocul unui
         cuvânt.

         Fără ea, tastatura ține rostirea deschisă: un clic la fiecare jumătate
         de secundă repune ceasul tăcerii, dar adaugă doar o zecime ceasului
         vorbirii, deci tamponul adună zeci de secunde, cu „engage" în ele. Pusă
         în ramura de zgomot, ar reteza cuvântul în două: diferența e LOCUL. */
      if(this.tTacere>=this.pragTacere ||
         (this.maxim && this.tDeschisa>=this.maxim+this.pragTacere+1)){
        // Durata VORBITĂ pleacă odată cu rostirea, fiindcă rândul de mai jos o
        // șterge. Firul principal n-are de unde s-o afle altfel: el vede
        // tamponul întreg, cu tăcerile în el, nu cât s-a stat peste prag.
        const vorbitSec=this.vorbitSec;
        this.vorbit=false;
        this.tTacere=0; this.vorbitSec=0; this.tCurat=0; this.tDeschisa=0;
        this.port.postMessage({tip:'sfarsit', vorbit:vorbitSec});
      }
      return true;
    }

    this.tCurat+=dt;
    // Zgomotul scurt care n-a ajuns frază se uită: altfel s-ar aduna peste
    // fraza următoare și ar face-o să pară că a început mai devreme.
    if(this.tCurat>1)this.vorbitSec=0;
    if(this.tCurat>=this.reciclare){
      this.tCurat=0;
      this.port.postMessage({tip:'recicleaza'});
    }
    return true;
  }
}
registerProcessor('ureche', Ureche);
`;

/* Un reportofon și vectorul în care scrie, legate la creare.
   Vectorul NU e global: stop() mai emite un `dataavailable` final, cu coada
   înregistrării care se închide. Cu un vector comun, bucata aia ar ateriza
   prima în blob-ul frazei URMĂTOARE — un fragment fără antet EBML, pe care
   decodorul îl refuză cu InvalidDataError, la fiecare frază după prima. */
function reportofon(){
  const bucati=[];
  const rec=new MediaRecorder(U.flux);
  // Clipa nașterii. Singurul loc din program care știe cât audio s-a adunat
  // într-un tampon — firul audio n-are de unde ști, nu el înregistrează.
  const t0=Date.now();
  rec.ondataavailable=e=>{if(e.data&&e.data.size)bucati.push(e.data);};
  // 250 ms: bucăți mici, ca fraza să fie completă în memorie în clipa în care
  // se lasă tăcerea. Whisper primește tot ce s-a adunat, nu bucăți separate —
  // are nevoie de fraza întreagă ca să nimerească anglicismele.
  rec.start(250);
  return {rec,bucati,t0};
}

/* Starea motorului de conversație, citită de trei locuri: eticheta lui COMMAND,
   eticheta AGOREI și culoarea amândurora. `null` = încă n-a răspuns nicio sondă;
   nu se presupune nici „viu", nici „mort", ca la RECON. */
const MOTOR={viu:null,cum:null};
/* De ce NU ascultă urechea, ținut într-un singur loc: de el atârnă și CULOAREA,
   nu doar textul — cât e scris aici, COMMAND e rece. Un nod rece trebuie să-și
   spună motivul, deci mesajul nu se șterge singur după câteva secunde. */
let URECHE_MOTIV='';
function urecheaTace(motiv){URECHE_MOTIV=motiv;tagCmd(motiv);}

/* Eticheta lui COMMAND are DOI scriitori care se pot suprapune la pornire:
   dictarea și motorul. De-asta implicitul nu e un literal, ci se alege din
   starea AMÂNDURORA — același tipar ca `ureche()`: starea se schimbă într-un
   loc, nu în cinci. Cu `tagCmd('')`, sonda motorului își reface eticheta fără
   să știe nimic despre dictare, și invers.

   Culoarea trece tot pe aici, din același motiv: `tagCmd` e deja locul prin
   care trec TOATE schimbările — sonda motorului, `ureche()`, și fiecare ramură
   în care urechea renunță. */
function tagCmd(s){
  refaCmd();
  NODES.cmd.tag=s||etichetaCmd()||'postul de comandă';
}
/* Portocaliul lui COMMAND înseamnă „poți vorbi cu ea", deci ține de AMÂNDOUĂ:
   motorul răspunde ȘI urechea e armată.

   Se poate atârna o culoare de armarea urechii fiindcă în spatele semnalului nu
   e nicio gaură: între `gata`+`trezire` (ce vede puntea) și prima transcriere
   reușită trec 0,38–0,40 s, iar textul e corect din prima.

   AGORA rămâne pe motorul singur: „Socrate nu primește ureche". */
function refaCmd(){
  const poate=!!(MOTOR.viu&&U.pornita);
  NODES.cmd.on=poate?1:0;
  NODES.cmd.hue=poate?'lamp':'ice';
}
function etichetaCmd(){
  // Motorul se numește primul: el e cel care poate fi oprit de tot, deci cel
  // care se repară. Urechea, la pornire, vine singură.
  const m=etichetaMotor();
  if(m)return m;
  // Motorul răspunde, dar urechea nu. Nodul e rece și pentru asta, deci
  // eticheta trebuie să spună care din două lipsește.
  if(!U.pornita)return URECHE_MOTIV||'urechea pornește';
  // „aștept" e implicitul, nu un text scris de `ureche()`. Altfel cei doi
  // scriitori se bat: la pornire rece, cu urechea armată înaintea motorului,
  // eticheta ar clipi între „motorul pornește" și „aștept" peste un nod rece.
  // Așa, ordinea e una singură: motorul, urechea, apoi starea urechii.
  return U.mod==='astept'?'aștept':'';
}
/* Numai despre motor — AGORA îl folosește neatins, fiindcă ea n-are ureche. */
function etichetaMotor(){
  if(MOTOR.viu)return '';
  // „nu răspunde" nu se spune despre un motor care a răspuns cu eroare: nu se
  // repară pornind ce e deja pornit.
  if(MOTOR.cum==='eroare')return 'motorul răspunde cu eroare';
  if(MOTOR.cum==='oprit')return 'motorul e oprit';
  // Și cât nicio sondă n-a răspuns (`null`): eticheta merge cu culoarea, iar
  // nodul e desenat rece de la construcție. Un nod rece lângă „postul de
  // comandă" ar fi spus două lucruri diferite despre aceeași clipă.
  return 'motorul pornește';
}

/* Starea și pauza urechii se schimbă ÎMPREUNĂ, aici, nu în cinci locuri: pauza
   e un mesaj către firul audio, și trebuie trimis oriunde s-ar schimba starea.
   Legat de `ureche()`, nu poate rămâne în urmă. */
function ureche(s){
  U.stare=s;
  // Pauza e NUMAI pentru ENGAGE. Acolo are rost: ce spui peste transcrierea
  // frazei anterioare aparține frazei tale, deci n-are voie să se taie în două.
  //
  // În AȘTEPT e exact pe dos: cât ține pauza (2–7 s pe mașină încărcată),
  // reportofonul nu se reciclează, rostirile se lipesc una de alta, iar
  // cuvântul se îneacă în ele („This is a good age."). Probele sunt
  // independente: fiecare rostire e o întrebare de sine stătătoare.
  const ocupat=(U.mod==='engage'&&(s==='transcriu'||s==='trimit'));
  try{if(U.nod)U.nod.port.postMessage(ocupat?'pauza':'reia');}catch(e){}
  // În AȘTEPT eticheta nu se mișcă. Starea de dedesubt se schimbă la fel — o
  // probă chiar se transcrie — dar „transcriu…" ar clipi sub COMMAND la fiecare
  // vorbă spusă în cameră, ca și cum JA.S.Mine ar lucra pentru tine când de fapt
  // doar verifică dacă a fost chemată.
  if(U.mod==='astept'){tagCmd('');return;}
  tagCmd({ascult:'ascult', vorbesti:'te aud',
          transcriu:'transcriu…', trimit:'trimit…'}[s]||'');
}

// „Înapoi la ascultare" înseamnă altceva în fiecare stare, și e chemat din
// cinci locuri. Scris o dată.
function revinoLaAscultare(){
  ureche(U.mod==='engage'?'ascult':'astept');
}

function opresteUrechea(motiv){
  if(!U.pornita)return;
  U.pornita=false;U.stare='';
  if(U.razg){clearTimeout(U.razg);U.razg=null;}
  // Cererea în zbor nu se anulează, dar rezultatul ei se aruncă: cerere++ face
  // ca răspunsul vechi să nu se mai potrivească.
  U.cerere++;
  try{if(U.r&&U.r.rec.state!=='inactive')U.r.rec.stop();}catch(e){}
  // Worklet-ul se oprește singur la mesajul ăsta (`process` întoarce false).
  // Închiderea contextului l-ar opri oricum, dar un fir audio care se stinge
  // fiindcă i s-a spus e altceva decât unul care se stinge fiindcă i s-a luat
  // pământul de sub picioare.
  try{if(U.nod){U.nod.port.postMessage('stop');U.nod.disconnect();}}catch(e){}
  // Oprirea pistelor stinge indicatorul de microfon din sistem. Fără ea, rămâne
  // aprins deși nimeni nu mai ascultă.
  try{if(U.flux)U.flux.getTracks().forEach(p=>p.stop());}catch(e){}
  try{if(U.ac)U.ac.close();}catch(e){}
  U.r=null;U.flux=null;U.ac=null;U.nod=null;U.nivel=0;U.strang=0;U.mod='';
  U.probaInZbor=false;U.probaLaRand=null;
  NODES.cmd.strang=0;NODES.cmd.burst=0;
  urecheaTace(motiv==='refuzat'?'microfon refuzat':'');
}

function reglaje(){
  return U.reglaje||U_IMPLICIT;
}

/* Pragurile se schimbă cu starea, pe aceeași ușă prin care au intrat prima
   dată. Două numere diferă:

   `prag_tacere` — cât taci ca rostirea să se închidă. În AȘTEPT e scurt (un
   cuvânt e un cuvânt); în ENGAGE e cel din dictare.json, unde o pauză de gândit
   n-are voie să taie fraza.

   `maxim` — plafonul peste care rostirea se aruncă fără să fie transcrisă. În
   ENGAGE e 0, adică stins. */
function aplicaPraguri(){
  if(!U.nod)return;
  U.nod.port.postMessage({praguri:praguri()});
}

/* Cele patru numere care diferă între stări. Scrise o dată, folosite și la
   crearea nodului, și la fiecare schimbare de stare — două liste care ar fi
   putut să se despartă în tăcere. */
function praguri(){
  const R=reglaje(),T=R.trezire;
  if(U.mod==='engage'||!T)return{
    prag_tacere:R.prag_tacere_secunde, maxim:0,
    prag_volum:R.prag_volum, secunde_minim_vorbire:R.secunde_minim_vorbire};
  // În AȘTEPT pragurile sunt mai JOASE: de la doi metri, vocea abia trece de
  // pragul dictării, iar înregistrarea pornește prea târziu — „engage" spus și
  // neauzit. O probă goală costă 0,02–0,06 s; un cuvânt neauzit costă o tură de
  // vorbit degeaba.
  return{
    prag_tacere:T.trezire_prag_tacere, maxim:T.trezire_maxim_secunde,
    prag_volum:T.trezire_prag_volum, secunde_minim_vorbire:T.trezire_minim_vorbire};
}

// Reportofonul vechi mai emite o bucată finală după stop(). Ea aterizează în
// vectorul LUI, fiindcă reportofon() face unul nou la fiecare chemare — vezi
// comentariul de acolo.
function reiaReportofonul(){
  try{if(U.r)U.r.rec.stop();}catch(e){}
  U.r=U.pornita?reportofon():null;
}

async function pornesteUrechea(mod){
  if(U.pornita)return true;
  U.mod=mod||'astept';
  // Reglajele se cer la fiecare pornire, nu o dată la încărcarea paginii:
  // pragul se schimbă în fișier și trebuie să se simtă la următoarea dictare,
  // fără reîncărcarea punții.
  try{
    const d=await (await fetch('/api/dictare')).json();
    if(d&&d.ok){
      U.reglaje=d;
      // „se încarcă" nu e „nu e pornită": prima trece singură, a doua se repară.
      if(!d.gata){urecheaTace(d.se_incarca?'dictarea se încarcă…':'dictarea nu e pornită');
        return false;}
    }
  }catch(e){ /* merge pe implicite; nu e motiv să nu asculți */ }

  try{
    U.flux=await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  }catch(e){
    // Refuz sau lipsă de microfon. localhost e context securizat, deci nu e
    // nevoie de HTTPS — dacă puntea s-ar muta pe altă adresă, aici ar muri.
    //
    // urecheaTace direct, NU opresteUrechea('refuzat'): urechea încă nu e
    // pornită, iar opresteUrechea iese pe loc când `U.pornita` e fals — refuzul
    // s-ar vedea doar în consolă, adică nicăieri, într-o fereastră fără bară.
    urecheaTace('microfon refuzat');
    return false;
  }

  try{
    U.ac=new (window.AudioContext||window.webkitAudioContext)();
    // Politica de autoplay a Chrome pornește contextul „suspended" când n-a fost
    // un gest al omului — iar AȘTEPT pornește la încărcarea paginii, unde nu e
    // niciun gest. Chrome îl lasă să pornească fiindcă originea are permisiune
    // de microfon (scrisă în profil de pregateste-chrome.py), dar asta e o
    // politică, nu o lege: dacă nu pornește, se agață de primul gest care vine.
    if(U.ac.state==='suspended')await U.ac.resume().catch(()=>{});
    if(U.ac.state!=='running')asteaptaUnGest();
    const url=URL.createObjectURL(
      new Blob([URECHE_WORKLET],{type:'text/javascript'}));
    await U.ac.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);
    U.nod=new AudioWorkletNode(U.ac,'ureche',
      {processorOptions:Object.assign({reciclare:RECICLARE},praguri())});
    U.nod.port.onmessage=e=>ascultaUrechea(e.data);
    U.ac.createMediaStreamSource(U.flux).connect(U.nod);
    // Nodul TREBUIE legat mai departe, către destinație, altfel graful audio îl
    // consideră mort și `process()` nu mai e chemat NICIODATĂ. Se leagă printr-un
    // câștig pe zero: nu se aude nimic, dar urechea trăiește. Fără asta tace, și
    // tace fără să se plângă.
    const mut=U.ac.createGain();mut.gain.value=0;
    U.nod.connect(mut).connect(U.ac.destination);
  }catch(e){
    // Un worklet care nu se încarcă lasă microfonul aprins și urechea moartă —
    // exact starea care nu se vede. Se strânge tot și se scrie pe ecran.
    console.error('dictare: urechea nu a pornit',e);
    try{if(U.flux)U.flux.getTracks().forEach(p=>p.stop());}catch(ex){}
    try{if(U.ac)U.ac.close();}catch(ex){}
    U.flux=null;U.ac=null;U.nod=null;U.mod='';
    urecheaTace('urechea nu a pornit');
    return false;
  }

  U.pornita=true;U.nivel=0;U.strang=0;
  // Singurul loc care ȘTERGE motivul: de aici încolo urechea chiar ascultă,
  // iar `revinoLaAscultare` trece prin `tagCmd`, deci aprinde și nodul.
  URECHE_MOTIV='';
  U.r=reportofon();
  revinoLaAscultare();
  return true;
}

// Un context audio suspendat arată exact ca unul care merge: nicio eroare,
// numai liniște. Se agață de primul gest, o singură dată.
function asteaptaUnGest(){
  const trezeste=()=>{
    if(U.ac)U.ac.resume().catch(()=>{});
    removeEventListener('keydown',trezeste,true);
    removeEventListener('click',trezeste,true);
  };
  addEventListener('keydown',trezeste,true);
  addEventListener('click',trezeste,true);
}

/* Ce vine de pe firul audio. Aici nu se numără nimic — se hotărăște.
   Nivelul și strângerea sunt puse deoparte pentru desen; frame() le citește la
   cadru, ca înainte, doar că sursa lor nu mai moare cu fereastra. */
function ascultaUrechea(m){
  if(!U.pornita||!m)return;
  if(m.tip==='nivel'){U.nivel=m.v;U.strang=m.strang;return;}
  if(m.tip==='inceput'){
    if(U.stare==='ascult'||U.stare==='vorbesti')ureche('vorbesti');
    return;
  }
  if(m.tip==='sfarsit'){
    // Durata vorbită contează doar în ENGAGE, unde hotărăște dacă rostirea are
    // voie să plece la Sky. În AȘTEPT filtrul e chiar cuvântul de trezire.
    if(U.mod==='engage')inchideFraza(m.vorbit); else inchideRostirea();
    return;
  }
  if(m.tip==='prea-lung'){
    // Rostirea a trecut de plafon. Se aruncă AICI: nu se transcrie, nu pleacă
    // nicăieri, nu costă nimic. Se scrie doar în jurnal, ca peste o săptămână
    // să se știe de câtă vorbire din cameră ne-a apărat plafonul.
    jurnalTrezire('prea_lung','',{durata_audio:Math.round(m.secunde*10)/10});
    reiaReportofonul();
    return;
  }
  if(m.tip==='recicleaza')reiaReportofonul();
}

/* ── Cele două cuvinte ───────────────────────────────────────────────
   Textul se caută NORMALIZAT și PE BUCĂȚI, nu comparat întreg: Whisper scrie
   „Engage.", „Then, engage.", „and the age." pentru același cuvânt spus
   românește. O comparație pe text întreg le-ar respinge pe aproape toate. */
function normalizeaza(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'')
    .replace(/[^a-z0-9]+/g,' ').trim();
}

/* Distanța de editare, plafonată: nu ne interesează cât de departe e un cuvânt,
   doar dacă e mai aproape decât atât. Iese devreme pe cuvinte de lungimi prea
   diferite, ca să nu plimbe matricea degeaba. */
function distanta(a,b,plafon){
  if(Math.abs(a.length-b.length)>plafon)return plafon+1;
  let prec=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const cur=[i];let minRand=i;
    for(let j=1;j<=b.length;j++){
      const cost=a[i-1]===b[j-1]?0:1;
      cur[j]=Math.min(prec[j]+1,cur[j-1]+1,prec[j-1]+cost);
      if(cur[j]<minRand)minRand=cur[j];
    }
    if(minRand>plafon)return plafon+1;
    prec=cur;
  }
  return prec[b.length];
}

/* Cuvintele de adormire, una singură pentru amândouă ușile. Serverul le trimite
   gata ca listă și INDEPENDENT de `trezire`: ușa tastată n-are nevoie nici de
   ureche, nici de iGPU. */
function cuvinteAdormire(){
  const v=reglaje().cuvinte_adormire;
  return Array.isArray(v)?v.map(normalizeaza).filter(Boolean):[];
}

/* UN mecanism, două canale, două praguri — aceeași regulă care ține „engage" și
   Alt+A să nu se poarte diferit. Pragurile:

   VORBIT, cuvânt LUNG (≥ CUVANT_LUNG litere; toleranța urcă la 2 de la 8):
   se caută cu toleranță, dar numai la CAPĂTUL rostirii. „disengage" e străin și
   lung, Whisper îl sparge („Disangage.", „dis angage"), dar nimic din română nu
   se apropie de el din greșeală. NU „oriunde în frază": cuvântul folosit la
   mijloc ca să vorbești DESPRE el ar înghiți fraza întreagă. Comanda se pune la
   sfârșit, vorba despre ea nu.

   VORBIT, cuvânt SCURT: exact, ca ULTIM cuvânt al unei rostiri de cel mult
   FEREASTRA_CUVINTE. Fără toleranță: „stop" are patru litere și e cuvânt
   românesc obișnuit — cu toleranța de mai sus l-ar prinde „stoc" și „top".
   Ultim cuvânt, nu rostirea întreagă: Whisper pune umplutură ÎNAINTEA lui
   („Ok, stop."). Plafonul de cuvinte separă comanda (1–2 cuvinte) de vorba
   DESPRE cuvânt (o frază lungă); costul lui e o comandă spusă într-o frază
   lungă, adică un apel plătit — partea ieftină a asimetriei.

   TASTAT: orice cuvânt, doar ca MESAJ ÎNTREG. Tastat nu există nici zgomot, nici
   umplutură — omul scrie exact ce vrea, deci „ce înseamnă disengage?" ajunge la
   Sky ca orice întrebare. */
/* Cele două praguri servesc AMBELE direcții, adormirea și trezirea: un cuvânt
   scurt e scurt la fel în orice direcție, iar dacă pragurile s-ar despărți,
   „stop" și „start" ar ajunge să se poarte diferit fără ca cineva să fi decis
   asta.

   `CUVANT_LUNG` (6) spune „e străin, deci se caută larg"; „e destul de lung ca
   să suporte două greșeli" e alt prag (8), scris acolo unde se calculează
   plafonul. „engage" are ȘASE litere — cu 8 ar cădea pe ramura scurtă și n-ar
   mai fi găsit în „Engage, engage, engage…".

   Lungimea e o unealtă aproximativă pentru „cuvânt pe care româna vorbită nu-l
   scoate din greșeală": „start" (5) și „stop" (4) sunt românești, „engage" (6)
   și „disengage" (9) nu. Aproximarea greșește ieftin: regula strictă e cea
   sigură, deci un cuvânt nou și scurt intră apărat. Unul lung se măsoară pe
   `date\trezire.jsonl` înainte să fie adăugat. */
const CUVANT_LUNG=6, FEREASTRA_CUVINTE=4;
/* Trezirea: o literă greșită, nici două. Argumentul și cifrele stau la
   `cautaCuvantul`, unde se și folosește. */
const TREZIRE_TOLERANTA=1;

/* Canalul TASTAT: mesajul întreg, exact. Nici zgomot, nici umplutură — omul
   scrie exact ce vrea. */
function esteAdormire(text){
  const n=normalizeaza(text);
  return !!n&&cuvinteAdormire().some(c=>n===c);
}

/* Canalul VORBIT: taie cuvântul de adormire de la CAPĂTUL rostirii și întoarce
   ce a rămas înaintea lui.

   Întoarce `rest`, nu doar „da/nu", fiindcă restul e ce ai spus și trebuie să
   ajungă la Sky: „notează X, disengage" n-are voie să piardă X. Ce NU pleacă e
   cuvântul însuși: nu plătești un apel ca să spui „lasă-mă în pace".

   Cuvintele se caută cu indicele lor în textul ORIGINAL, nu se taie textul în
   bucăți pe spații: „Dis-uncage." e UN cuvânt despărțit de spații, dar DOUĂ
   după normalizare, iar tăiat pe spații ar ieși „dis uncage" — fără potrivire.
   Cu indicele, `rest` se ia din original, feliat exact acolo unde începe
   comanda, cu diacritice și punctuație intacte. */
const ADORMIRE_MIN_REST=2;
function taieAdormirea(text){
  const s=text||'';
  const bucati=[];                       // {n: cuvântul normalizat, i: unde începe}
  const re=/[\p{L}\p{N}]+/gu;
  let m;
  while((m=re.exec(s))!==null){
    const w=normalizeaza(m[0]);
    if(w)bucati.push({n:w,i:m.index});
  }
  const nimic={gasit:false,rest:s};
  if(!bucati.length)return nimic;
  const U1=bucati[bucati.length-1], U2=bucati.length>1?bucati[bucati.length-2]:null;
  /* `rest` se dă doar de la două cuvinte în sus. Sub atât nu e vorbă, e
     umplutură („Ok, stop.", „Ok, disengage."): un „Ok," trimis la Sky ar fi un
     apel plătit ca să nu spui nimic. */
  const taie=b=>{
    const r=s.slice(0,b.i).trim();
    return {gasit:true,
            rest:r.split(/\s+/).filter(Boolean).length>=ADORMIRE_MIN_REST?r:''};
  };
  for(const c of cuvinteAdormire()){
    if(c.length>=CUVANT_LUNG){
      const plafon=c.length>=8?2:1;
      if(distanta(U1.n,c,plafon)<=plafon)return taie(U1);
      // Whisper despică uneori cuvântul străin în două („dis angage"), și
      // atunci niciuna din bucăți nu mai seamănă cu întregul — lipite, da.
      if(U2&&distanta(U2.n+U1.n,c,plafon)<=plafon)return taie(U2);
    }else if(bucati.length<=FEREASTRA_CUVINTE&&U1.n===c){
      return taie(U1);
    }
  }
  return nimic;
}

/* Cuvintele care bagă în ENGAGE, normalizate. Vin de la server gata ca listă
   (`cuvinte_trezire` din `server.py`), ca și cele de adormire — puntea n-are de
   ghicit dacă pe disc e un șir sau o listă. */
function cuvinteTrezire(){
  const T=reglaje().trezire;
  const v=T&&T.cuvant_trezire;
  return (Array.isArray(v)?v:[v]).map(normalizeaza).filter(Boolean);
}

function cautaCuvantul(text){
  const T=reglaje().trezire;
  if(!T)return null;
  const n=normalizeaza(text);
  const cuv=n.split(' ').filter(Boolean);
  // „disengage" se caută ÎNAINTEA lui „engage", fiindcă îl conține literal.
  // În ordinea inversă, „disengage" ar porni Sky în loc să-l oprească — un
  // defect care ar părea capriciu, nu greșeală.
  if(taieAdormirea(text).gasit)return 'adormire';
  // TREZIREA ARE DOUĂ UȘI: „engage" și „start". A doua e o cheie la aceeași
  // cameră, nu un al treilea cuvânt de ținut minte — exact ce e „stop" pentru
  // „disengage". Cele două chei nu se caută la fel, fiindcă nu seamănă: una e
  // lungă și străină, cealaltă scurtă și românească. Regula se alege pe
  // lungime, cu aceleași două praguri care țin adormirea.
  //
  // CUVÂNT LUNG (≥ CUVANT_LUNG litere) — oriunde în rostire, cu toleranță 1.
  //
  // AMÂNDOUĂ direcțiile au toleranță, dar nu aceeași — asimetria costurilor
  // rămâne întreagă. O adormire ratată costă un apel plătit și un chat care nu
  // se închide; o trezire falsă costă mai mult, fiindcă JA.S.Mine sare peste ce
  // lucrezi. De-asta adormirea urcă la 2 pe cuvinte lungi, iar trezirea stă la
  // 1 și nu se mișcă de acolo. Măsurat pe jurnalul probelor, `date\trezire.jsonl`
  // (1.961 rostiri aruncate, 94 treziri):
  //
  //   distanța 1 → 3 treziri RATATE („encage", „engege", „engege"), 0 străine
  //   distanța 2 → aceleași 3, plus 3 FALSE („ben gage", „langage", „inage")
  //   distanța 3 → plus 21 de false, printre care „name", „enough", „atrage"
  //
  // Se caută PE CUVÂNT ÎNTREG, niciodată pe cuvinte lipite. Adormirea își
  // permite lipirea („dis angage"), trezirea nu: „ben gage" lipit dă „bengage",
  // la distanță 1 — adică exact una din trezirile false de mai sus. Cifra și
  // mecanismul trebuie să spună același lucru.
  //
  // CUVÂNT SCURT — exact, la CAPĂTUL unei rostiri de cel mult
  // FEREASTRA_CUVINTE. Fără toleranță și fără „oriunde": „start" e cuvânt
  // românesc obișnuit. Măsurat pe 1.970 de rostiri `aruncat`:
  //
  //   exact, la capăt, în ≤4 cuvinte → 0 treziri false
  //   exact, oriunde                 → 2 (fraze obișnuite care conțin „start")
  //   ca subșir (regula celui lung)  → 3 (plus un „restartat")
  //
  // O trezire venită prin toleranță se recunoaște în jurnal fără câmp nou:
  // e un rând `trezit` al cărui text nu conține cuvântul scris exact.
  for(const tinta of cuvinteTrezire()){
    if(tinta.length>=CUVANT_LUNG){
      if(n.indexOf(tinta)>=0)return 'trezire';
      // Numai pentru un cuvânt de trezire dintr-o bucată: pe unul cu spații,
      // „cuvântul cel mai apropiat" n-ar mai însemna nimic.
      if(tinta.indexOf(' ')<0&&cuv.some(
           w=>distanta(w,tinta,TREZIRE_TOLERANTA)<=TREZIRE_TOLERANTA))
        return 'trezire';
    // Capătul se caută pe TEXTUL normalizat, nu pe ultimul cuvânt: așa merge
    // și un cuvânt scurt din două bucăți, fără o a doua ramură care să-l
    // trateze separat.
    }else if(cuv.length<=FEREASTRA_CUVINTE&&(n===tinta||n.endsWith(' '+tinta))){
      return 'trezire';
    }
  }
  return null;
}

/* O rostire auzită în AȘTEPT. Drum separat de `inchideFraza()`, dinadins:

   1. NU se schimbă starea, deci firul audio nu intră în pauză și reciclarea
      merge mai departe. Rostirile rămân scurte și curate.
   2. NU se folosește `U.cerere`. Acolo, o cerere nouă o invalidează pe cea
      veche — corect pentru o frază care se scrie într-un câmp, greșit aici:
      dacă spui „engage" și imediat după se aude altceva, răspunsul care conține
      cuvântul ar fi aruncat tocmai fiindcă a venit al doilea. Fiecare probă e o
      întrebare de sine stătătoare și primește răspuns de sine stătător. */
/* Cât poate fi de VECHI un tampon care mai are voie să plece la transcriere.

   Un cuvânt de trezire e un cuvânt, iar 7 secunde e o cifră care a funcționat.
   **Se coboară sau se ridică pe folosire, nu pe raționament.**

   Limita e AICI, la trimitere, nu pe firul audio. Pusă acolo, ar tăia vorbirea
   în mijloc și ar ciunti chiar cuvântul. Aici nu poate rupe nimic — rostirea se
   închide când se închide, iar dacă tamponul a ieșit prea lung se aruncă
   întreg. Mai bine o rostire pierdută decât una ciuntită: una se repetă,
   cealaltă pare că unealta n-aude. */
const TAMPON_MAXIM_MS=7000;

function inchideRostirea(){
  const vechi=U.r;U.r=null;
  if(!vechi){reiaReportofonul();return;}
  const gata=()=>{
    if(U.pornita&&!U.r)U.r=reportofon();
    const varsta=Date.now()-vechi.t0;
    if(varsta>TAMPON_MAXIM_MS){
      jurnalTrezire('prea_lung','',{durata_audio:Math.round(varsta/100)/10});
      return;
    }
    trimiteProba(vechi.bucati);
  };
  try{vechi.rec.onstop=gata;vechi.rec.stop();}catch(e){gata();}
}

/* CEL MULT O PROBĂ ÎN ZBOR, plus un singur loc de așteptare.

   Tăierea rostirilor merge mai departe neîntrerupt, dar TRIMITEREA se așază la
   rând: motorul face o inferență o dată. Apărarea e prima din două — conducta
   OpenVINO are propriul zăvor pe server. Cea de aici scutește drumul, cea de
   acolo apără obiectul.

   Locul de așteptare ține rostirea CEA MAI NOUĂ, nu prima: dacă spui „engage"
   cât se lucrează la un zgomot de dinainte, cuvântul tău e cel care trebuie să
   ajungă. Ce se pierde se scrie în jurnal ca `aglomerat`, ca să se știe cât de
   des se întâmplă. */
function trimiteProba(bucati){
  if(!bucati||!bucati.length)return;
  if(U.probaInZbor){
    if(U.probaLaRand)jurnalTrezire('aglomerat','',null);
    U.probaLaRand=bucati;
    return;
  }
  U.probaInZbor=true;
  trimiteCatreWhisper(bucati).then(d=>{
    U.probaInZbor=false;
    // Între timp s-a putut intra în ENGAGE, sau urechea s-a putut opri.
    if(U.pornita&&U.mod==='astept')cerceteazaProba(d);
    const laRand=U.probaLaRand;U.probaLaRand=null;
    if(laRand&&U.pornita&&U.mod==='astept')trimiteProba(laRand);
  });
}

/* O probă a venit pe rezervă. Se întreabă serverul dacă iGPU-ul mai trăiește
   — `/api/dictare` întoarce `trezire: null` exact atunci, fiindcă trezirea are
   voie să meargă doar cu el viu. O cerere, într-un caz rar.

   Dacă e viu, segmentul a fost doar lung: se cercetează textul ca oricare altul.
   Cuvântul poate fi acolo, și n-are de ce să se piardă. */
function verificaAcceleratorul(d){
  fetch('/api/dictare').then(r=>r.json()).then(x=>{
    if(x&&x.ok&&x.gata&&x.trezire){
      U.reglaje=x;
      cerceteazaTextul(d);
      return;
    }
    console.warn('trezire: iGPU-ul a cazut, opresc AȘTEPT');
    // Urmarea își păstrează numele vechi: rândurile din jurnal îl poartă, iar
    // o etichetă redenumită ar rupe numărătoarea în două fără să câștige nimic.
    jurnalTrezire('accelerator-mort',(d.text||'').trim(),d);
    opresteUrechea('');
    urecheaTace('trezirea s-a oprit · Alt+A');
    // Se REÎNCEARCĂ peste un minut, nu se rămâne mort până la reîncărcarea
    // paginii. Cazul obișnuit nu e un iGPU crăpat, e un server repornit.
    // `armeazaTrezirea` verifică singură dacă e ceva de pornit.
    setTimeout(()=>{if(!U.pornita)armeazaTrezirea();},60000);
  }).catch(()=>cerceteazaTextul(d));
}

function cerceteazaProba(d){
  // „A venit de la faster-whisper" NU înseamnă că iGPU-ul a murit. Serverul
  // poate cădea pe rezervă și dintr-un motiv trecător, și spune singur care:
  // câmpul `motiv` din răspuns. Fără deosebire, un „Engage." auzit și transcris
  // corect ar fi aruncat, iar urechea oprită. **O apărare care nu deosebește
  // cauzele apără de cazul greșit.**
  if(d&&d.ok&&d.motor&&d.motor!=='openvino-igpu'){
    verificaAcceleratorul(d);
    return;
  }
  cerceteazaTextul(d);
}

function cerceteazaTextul(d){
  // Eticheta se rescrie la fiecare probă, nu doar la intrarea în stare: e
  // singurul semn de pe ecran că JA.S.Mine ascultă. Un semn care se stinge
  // singur e mai rău decât niciunul: te uiți la el și te liniștești.
  if(U.mod==='astept')ureche('astept');
  const text=(d&&d.ok&&d.text||'').trim();
  const cuvant=cautaCuvantul(text);
  // O probă goală costă cât una adevărată, ~0,25 s: OpenVINO n-are VAD.
  //
  // **Ce trebuie urmărit prin folosire:** fără VAD, Whisper pe aproape-tăcere
  // nu poate spune „n-am auzit nimic" — prezice text. Poarta rămâne pragul de
  // volum și minimul de vorbire, care taie ÎNAINTE de trimitere; dacă apar
  // rânduri `aruncat` cu text inventat, aici se caută.
  // `bucla` în loc de `aruncat` când textul e ciclu: proba se aruncă la fel, se
  // schimbă doar ce SCRIE în jurnal, ca buclele să se poată număra separat.
  jurnalTrezire(!text?'gol':(cuvant==='trezire'?'trezit':(eBucla(text)?'bucla':'aruncat')),text,d);
  if(cuvant==='trezire')intraInEngage();
}

/* BUCLA. Fără VAD, Whisper pe aproape-tăcere nu poate spune „n-am auzit
   nimic" — prezice text, și de multe ori intră în ciclu, uneori chiar lista de
   hotwords („SENSORS, AGORA, MCP, COMMS, COMMS…"). Pe jurnal, ~7% din rostirile
   cu text.

   Pragul — cel puțin 12 cuvinte ȘI cel mult o treime unice — e cel care, trecut
   peste jurnalul întreg, prinde exact buclele. Cea mai scurtă prinsă are 12
   cuvinte; cea mai lungă rostire adevărată nescăpată are 60, din care 49 unice.

   DE CE STĂ AICI, ȘI NU ÎN SERVER: unele bucle poartă chiar un cuvânt de
   comandă („Engage: engage, engage…" a trezit corect). Un filtru pus în
   /api/transcrie ar goli textul înainte ca cineva să caute cuvântul în el,
   adică ar omorî o trezire ca să prevină o cheltuială. De-asta bucla se
   verifică DUPĂ adormire și DUPĂ trezire, ultima dintre toate. */
function eBucla(text){
  const c=(text||'').trim().split(/\s+/).filter(Boolean);
  if(c.length<12)return false;
  const unice=new Set(c.map(x=>x.replace(/[.,!?…"'\-—:;()]/g,'').toLowerCase()));
  return unice.size*3<=c.length;
}

/* Jurnalul probelor. Nu se vede nicăieri pe ecran, deliberat: rata alarmelor
   false nu se află din încă zece minute de citit cu voce tare, ci din câte ori
   s-a trezit JA.S.Mine într-o săptămână de folosire. Singura care poate număra asta
   e chiar ea. Eșecul se înghite — o măsurătoare n-are voie să oprească urechea. */
function jurnalTrezire(urmare,text,d){
  try{
    fetch('/api/trezire',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({urmare,text:text||'',
        audio:(d&&d.durata_audio)||0, lucru:(d&&d.durata_transcriere)||0,
        motor:(d&&d.motor)||null,
        // Pleacă MOTIVUL căderii pe rezervă, când există — altfel „a mers
        // încet" n-ar avea unde să se explice.
        motiv:(d&&d.motiv)||null})}).catch(()=>{});
  }catch(e){}
}

/* ── AȘTEPT ⇄ ENGAGE ─────────────────────────────────────────────────
   Aceeași ureche, același reportofon, același drum către /api/transcrie.
   Diferă doar ce se face cu textul care iese, și două praguri. Asta e ce ține
   mecanismul mic — și ce face ca „engage" și Alt+A să nu poată ajunge să se
   poarte diferit. */
/* Fiecare intrare și ieșire din ENGAGE se scrie în jurnal, cu MOTIVUL.
   O stare care se schimbă fără să lase urmă e o stare pe care n-o poți repara
   decât din noroc: fără motiv, un `trezit` urmat imediat de o ieșire nu spune
   ce a desfăcut intrarea. */
function intraInAstept(motiv){
  if(U.mod==='engage'){
    jurnalTrezire('iesit-engage',motiv||'nespus',null);
    // Camera ÎNCHISĂ înseamnă conversație încheiată. Ieșirea din ENGAGE e
    // singura ușă afară, deci un singur rând acoperă „disengage", „stop", `×`
    // și Escape — n-ai ce ține minte în plus.
    incheieFirul('sky');
  }
  if(!U.pornita){U.mod='';return;}
  U.mod='astept';
  if(U.razg){clearTimeout(U.razg);U.razg=null;}
  // O transcriere în zbor n-are unde ateriza după ce am ieșit din ENGAGE:
  // cerere++ face ca răspunsul ei să nu se mai potrivească.
  U.cerere++;
  aplicaPraguri();
  reiaReportofonul();
  U.strang=0;NODES.cmd.strang=0;NODES.cmd.burst=0;
  ureche('astept');
}

async function intraInEngage(){
  if(U.mod==='engage')return;
  // Muntele se închide ÎNTÂI, și fără să rearmeze urechea: o pornește
  // `pornesteUrechea('engage')` de mai jos, o singură dată. Trebuie aici, nu în
  // `openPanel`, fiindcă panoul se schimbă abia pe rândul următor — iar dacă
  // eram deja în COMMAND, `openPanel` nici nu se cheamă.
  opresteMuntele(false);
  // Întâi fereastra, apoi panoul: dacă JA.S.Mine e în bară, „engage" trebuie să
  // aducă în față ce deschide, altfel a trezit ceva ce nu vede nimeni.
  ridicaPuntea();
  if(selected!=='cmd')openPanel('cmd');
  if(!U.pornita&&!await pornesteUrechea('engage'))return;
  // Starea se schimbă ACUM, nu după ce se desenează panoul: cine spune cuvântul
  // începe să vorbească pe loc, iar fraza spusă imediat după „engage" ar nimeri
  // încă în AȘTEPT și ar fi aruncată. Așteptarea câmpului stă unde e adevărata
  // dependență: în pune().
  U.mod='engage';
  aplicaPraguri();
  reiaReportofonul();
  ureche('ascult');
  jurnalTrezire('intrat-engage','panou='+selected,null);
}

// Fără „devansare" (transcrierea pornită la 0,35 s de liniște, în paralel cu
// pragul): se declanșa la fiecare virgulă, iar contenția pe CPU costa mai mult
// decât câștiga (4,51 s singură, 12,76 s cu trei concurente). Nu o reintroduce
// fără să măsori latența totală, nu doar momentul plecării cererii.
function inchideFraza(vorbit){
  // ureche('transcriu') trimite și „pauza" pe firul audio: acolo se opresc
  // ceasurile care erau odată aici (tăcerea, vorbirea).
  ureche('transcriu');
  NODES.cmd.strang=0;U.strang=0;
  const nr=++U.cerere;
  const vechi=U.r;U.r=null;
  if(!vechi){revinoLaAscultare();return;}
  const gata=()=>{
    if(U.pornita&&!U.r)U.r=reportofon();
    trimiteCatreWhisper(vechi.bucati).then(d=>primeste(d,nr,vorbit));
  };
  try{vechi.rec.onstop=gata;vechi.rec.stop();}catch(e){gata();}
  plasa(nr);
}

function plasa(nr){
  // Plasă de ultimă instanță pentru o stare blocată, NU un termen pentru
  // transcriere: 30 s nu se atinge decât dacă cererea nu se încheie niciodată —
  // singurul caz care nu e acoperit de .then/.catch.
  setTimeout(()=>{
    if(U.pornita&&U.stare==='transcriu'&&nr===U.cerere){
      console.warn('dictare: transcrierea nu s-a incheiat, revin la ascult');
      revinoLaAscultare();
      if(!U.r)U.r=reportofon();
    }
  },30000);
}

function trimiteCatreWhisper(bucati){
  if(!bucati||!bucati.length)return Promise.resolve(null);
  const fd=new FormData();
  fd.append('audio',new Blob(bucati,{type:'audio/webm'}),'frază.webm');
  return fetch('/api/transcrie',{method:'POST',body:fd})
    .then(r=>r.status===200?r.json():{ok:false,eroare:'cerere respinsă ('+r.status+')'})
    .catch(()=>null);
}

function primeste(d,nr,vorbit){
  // Urechea s-a închis între timp, sau a plecat altă frază. Rezultatul
  // ăsta n-are unde ateriza.
  if(!U.pornita||nr!==U.cerere)return;
  const text=(d&&d.ok&&d.text||'').trim();

  // Probele din AȘTEPT nu trec pe aici — au drumul lor, `inchideRostirea()`.
  // Dacă am ajuns aici în AȘTEPT, e o frază rămasă din ENGAGE, prinsă de
  // schimbarea de stare: se uită.
  if(U.mod!=='engage')return;

  // În ENGAGE, cuvântul de adormire se verifică ÎNAINTE de orice. Ce se taie e
  // CUVÂNTUL, nu rostirea: ce ai spus înaintea lui pleacă la Sky, fiindcă e
  // vorba ta. Nu pleacă doar comanda — altfel ultimul lucru pe care i l-ai
  // spune lui Sky ar fi chiar ordinul de a nu-l mai deranja, plătit.
  const A=taieAdormirea(text);
  if(A.gasit){
    jurnalTrezire('adormit',text,d);
    // Trimiterea ÎNTÂI, ieșirea după: `closePanel` stinge URECHE, iar fără ea
    // n-ar mai avea cine să scrie în câmp. Camera se închide oricum imediat —
    // cererea rămasă în zbor își vede de drum și își scrie firul pe disc.
    if(A.rest)pune(A.rest,0,true);
    if(selected==='cmd'||manualDeschis)closePanel('disengage'); else intraInAstept('disengage');
    return;
  }
  /* A DOUA TREAPTĂ A PORȚII, și numai în ENGAGE. Poarta de la intrare e jos
     (0,15 s) ca „stop" — o silabă — să se poată naște. Dar în ENGAGE ce se naște
     pleacă la Sky, adică se plătește, iar la 0,15 s două apăsări de tastă în
     aceeași secundă cumulează destul cât să treacă.

     Așa că filtrul stă pe CE S-A SPUS, nu pe durată: rostirea scurtă se
     transcrie (local, gratis), dar merge mai departe doar dacă e cuvânt-comandă
     — iar adormirea s-a verificat deja, mai sus. Restul se scrie în jurnal
     (`scurt`) și se uită. Se pierd la fel „da." și „mersi" spuse intenționat,
     dar lasă urmă. */
  const P=reglaje().secunde_incredere_vorbire;
  if(vorbit!=null && P && vorbit<P){
    jurnalTrezire('scurt',text,d);
    ureche('ascult');
    return;
  }
  /* A TREIA TREAPTĂ: bucla. Ultima dintre toate, dinadins — adormirea și
     trezirea s-au căutat deja, iar o buclă care poartă cuvântul-comandă a
     apucat să-și facă treaba. Ce cade aici e doar ce ar fi plecat la Sky:
     apeluri plătite pe text pe care nu l-a spus nimeni („Stop! Stop! Stop!…").

     Se scrie în jurnal, ca `scurt`: ce nu pleacă mai departe lasă urmă. */
  if(eBucla(text)){
    jurnalTrezire('bucla',text,d);
    ureche('ascult');
    return;
  }
  // Ce se dictează în ENGAGE se scrie în jurnal, ca și ce se aude în AȘTEPT:
  // fără text, durată și motor, „transcrie aiurea ce vorbesc" n-ar avea nimic
  // măsurat în spate. Textul gol intră tot ca `dictat`, cu text vid: „n-a
  // transcris nimic" e unul dintre felurile de a transcrie aiurea.
  jurnalTrezire('dictat',text,d);
  if(!text){ureche('ascult');return;}
  pune(text);
}

/* `acum` sare peste răzgândire. Se folosește la adormire: răgazul există ca să
   te poți răzgândi cât mai vorbești, iar tu tocmai ai spus cuvântul care încheie.
   Fără el, cu răzgândirea pe altceva decât zero, mesajul ar aștepta un câmp pe
   care închiderea camerei tocmai l-a stins — și s-ar pierde în tăcere. */
function pune(text,incercare,acum){
  // Câmpul poate să nu existe încă: „engage" deschide panoul, iar panoul se
  // leagă la 320 ms. Textul AȘTEAPTĂ câmpul, nu se aruncă. Două secunde de
  // răbdare, apoi înapoi în AȘTEPT.
  if(!URECHE||!URECHE.viu()){
    if((incercare|0)<20){setTimeout(()=>pune(text,(incercare|0)+1,acum),100);return;}
    intraInAstept('campul nu a aparut in 2 s');return;
  }
  const R=reglaje();
  // Textul aterizează în câmp, vizibil. Nu ești obligat să-l citești, dar dacă
  // e stâlcit îl vezi cu coada ochiului și Escape îl oprește — rămâne în câmp,
  // corectabil, trimis cu Enter. Nu se pierde nimic.
  URECHE.camp.value=(URECHE.camp.value?URECHE.camp.value+' ':'')+text;
  ureche('trimit');
  // Cu răzgândirea pe 0, până și setTimeout(...,0) mai pierde un cadru. La zero
  // nu e nimic de așteptat, deci se trimite pe loc.
  const ms=acum?0:Math.max(0,R.secunde_razgandire*1000);
  if(!ms){ureche('ascult');
          try{URECHE.trimite();}catch(ex){console.error('dictare:',ex);}
          return;}
  U.razg=setTimeout(()=>{
    U.razg=null;
    if(!U.pornita||!URECHE||!URECHE.viu())return;
    // Urechea revine la ascultare ÎNAINTE de trimitere, și oricum.
    // Invers, o excepție în trimite() ar lăsa starea blocată pe „trimit",
    // adică firul audio rămas în „pauza": microfonul aprins, urechea care nu
    // mai închide nicio frază, fără niciun semn în afară de tag-ul care nu se
    // mai schimbă.
    ureche('ascult');
    try{URECHE.trimite();}
    catch(ex){console.error('dictare: trimiterea a esuat',ex);}
  },Math.max(0,R.secunde_razgandire*1000));
}

function anuleazaTrimiterea(){
  if(!U.razg)return false;
  clearTimeout(U.razg);U.razg=null;
  ureche('ascult');
  return true;
}

/* ── Escape trimite JA.S.Mine în bară ────────────────────────────────
   Puntea rulează în Chrome `--kiosk --app=`: fără bară de titlu, fără buton.
   Escape e singurul drum afară din fereastră. */
/* JA.S.Mine se MINIMIZEAZĂ, nu se închide: omul lucrează altceva între timp și
   o scoate din bară când are nevoie de ea.

   O apăsare, nu două. Minimizarea nu pierde nimic — un click în bară o aduce
   înapoi, iar urechea nici măcar nu se oprește. O confirmare pentru un gest
   care se desface cu un click e o treaptă simțită zilnic, fără să apere nimic.

   Nu există `window.minimize()`. O pagină nu poate umbla la fereastra care o
   ține, deci cere serverului. */
function minimizeazaPuntea(){
  tagCmd('în bară…');
  fetch('/api/minimizeaza-puntea',{method:'POST'})
    .then(r=>r.json())
    // `ferestre: 0` înseamnă că filtrul n-a găsit fereastra — nu că a mers.
    .then(d=>{tagCmd(d&&d.ok?'':'nu am putut minimiza');})
    .catch(()=>tagCmd('nu am putut minimiza'));
}

/* Urechea nu se oprește cu fereastra — firul audio n-are treabă cu ce se vede.
   Deci „engage" poate veni cât JA.S.Mine e în bară, și ar deschide chatul într-o
   fereastră pe care n-o vede nimeni. Se cere ridicarea mereu, iar SERVERUL
   hotărăște: ridică numai o fereastră aflată în bară — o unealtă n-are voie să
   sară peste ce face omul. Pagina nu ține minte dacă e minimizată: o stare
   ținută în două locuri se desincronizează.
   Nu se așteaptă răspunsul: panoul se deschide oricum. */
function ridicaPuntea(){
  try{fetch('/api/ridica-puntea',{method:'POST'}).catch(()=>{});}catch(e){}
}

/* Închiderea, de la singurul buton de pe hartă. `window.close()` MERGE într-o
   fereastră `--app`, iar serverul e rezerva, la 400 ms, pentru cazul în care
   ar fi refuzat. Se stinge TOT: fereastra, motorul și serverul. */
function inchideJasmine(){
  tagCmd('închid…');
  /* Ieșirea se cere ÎNAINTE de window.close(), nu în ruta de rezervă de mai
     jos: window.close() MERGE, deci `/api/inchide-puntea` nu se cheamă aproape
     niciodată, iar oprirea pusă acolo n-ar pleca decât în cazul rar.
     `keepalive` e ce ține cererea în viață după ce pagina dispare; fără el,
     Chrome o taie exact în momentul pentru care există. Nu se așteaptă
     răspunsul: ieșirea omului nu depinde de motor.
     Serverul nu moare odată cu cererea asta: se stinge singur, după ce vede
     fereastra plecată — altfel rezerva de mai jos ar rămâne fără ușă. */
  try{fetch('/api/iesire',{method:'POST',keepalive:true}).catch(()=>{});}catch(e){}
  try{window.close();}catch(e){}
  setTimeout(()=>{
    console.warn('inchidere: window.close() refuzat, cer serverului');
    fetch('/api/inchide-puntea',{method:'POST'})
      .then(r=>r.json())
      // `oprite: 0` înseamnă că filtrul n-a găsit fereastra — nu că a mers.
      .then(d=>{if(!d||!d.ok||!d.oprite)tagCmd('nu am putut închide');})
      .catch(()=>tagCmd('nu am putut închide'));
  },400);
}
document.getElementById('inchide').onclick=inchideJasmine;

/* Escape are trei înțelesuri lipite unul peste altul, iar ele nu se pot alege
   decât după CE E DESCHIS — deci scara stă într-un singur ascultător, nu în
   trei împrăștiate prin fișier:

     1. trimitere în răzgândire → se anulează, textul rămâne în câmp
     2. panou deschis          → se închide, iar urechea coboară în AȘTEPT
     3. nimic deschis          → JA.S.Mine se duce în bară

   Ordinea nu e alfabetică: panoul se verifică ÎNAINTE de minimizare, altfel un
   Escape dat ca să scapi de panou ar trimite toată fereastra în bară. */
addEventListener('keydown',e=>{
  if(e.altKey&&!e.ctrlKey&&!e.shiftKey&&(e.key==='a'||e.key==='A'||e.code==='KeyA')){
    e.preventDefault();
    // Alt+A face exact ce fac cele două cuvinte, prin aceleași funcții. Rămâne
    // ca ușă de rezervă: când cuvântul nu se aude, sau când iGPU-ul e mort și
    // AȘTEPT nici nu poate porni.
    if(U.mod==='engage'){
      if(selected==='cmd'||manualDeschis)closePanel('alt+a'); else intraInAstept('alt+a');
      return;
    }
    intraInEngage();
    return;
  }
  if(e.key!=='Escape')return;
  if(anuleazaTrimiterea())return;
  if(deschis()){closePanel('escape');return;}
  minimizeazaPuntea();
},true);

// Orice tastă apăsată în timpul răzgândirii oprește trimiterea: dacă ai pus
// mâna pe tastatură, vrei să corectezi, nu să plece.
addEventListener('keydown',e=>{
  if(U.razg&&e.key!=='Escape'&&!e.altKey)anuleazaTrimiterea();
});

const sheet=document.getElementById('sheet');
let lastFocus=null;
// Clasa se pune și la redimensionare, nu doar la deschidere: fereastra
// browserului se trage cu mouse-ul în timp ce panoul e deschis.
function potrivesteSheet(){sheet.classList.toggle('ingust',!larg());}
addEventListener('resize',potrivesteSheet);
/* Umplerea ferestrei e aceeași pentru un panou și pentru un manual — diferă
   doar ce se întâmplă cu harta în spatele ei. Scrisă o dată. */
function arataInSheet(p){
  // Clipul se oprește ÎNAINTE de orice altceva. Aici se acoperă trecerea la alt
  // panou sau la un manual — `closePanel` nu e chemat pe drumul ăsta, iar un
  // `<video>` scos din pagină cu `innerHTML` continuă să cânte în Chrome.
  // Chemată și când se deschide chiar MUNTELE: atunci oprește ce cânta și
  // `wire()` pornește de la primul clip, cum s-a cerut.
  opresteMuntele();
  document.getElementById('sh-n').textContent=p.n;
  document.getElementById('sh-s').textContent=p.s;
  document.getElementById('sh-c').innerHTML=p.html();
  // Fereastra mare o cere panoul, nu o impune sheet-ul: RECON și LOG rămân
  // înguste. `toggle` cu al doilea argument acoperă și trecerea directă de la
  // un panou mare la unul mic (butoanele de accesibilitate pot face asta).
  sheet.classList.toggle('mare',!!p.mare);
  // Ecranul plin e cerut tot de panou, ca `mare`. Un singur panou îl cere azi.
  sheet.classList.toggle('plin',!!p.plin);
  potrivesteSheet();
  sheet.classList.add('open');
  if(p.wire)setTimeout(()=>p.wire(),320);
}
function openPanel(k){
  const p=P[k];if(!p)return;
  lastFocus=document.activeElement;
  manualDeschis=null;
  selected=k;NODES[k].burst=1;
  arataInSheet(p);
}
/* Manualul folosește aceeași fereastră, dar NU selectează niciun nod: un text
   despre o cameră n-are de ce să tragă camera în mijlocul hărții. */
function openManual(k){
  if(!MANUALE[k])return;
  lastFocus=document.activeElement;
  selected=null;manualDeschis=k;
  // Chatul a ieșit din pagină, deci dictarea n-are unde scrie — exact cazul de
  // la închiderea unui panou. Și, ca acolo, camera închisă înseamnă conversație
  // încheiată; motivul se scrie în jurnal, ca orice ieșire din ENGAGE.
  URECHE=null;
  if(U.mod==='engage')intraInAstept('manual deschis');
  arataInSheet(faManual(k));
}
function closePanel(motiv){
  // Escape, `×`, clicul pe hartă. Camera închisă înseamnă tăcere — aceeași
  // formă cu firul care se încheie la ieșirea din ENGAGE. Aici se rearmează și
  // urechea, dacă muntele o tăcuse.
  opresteMuntele();
  selected=null;manualDeschis=null;
  // Panoul închis înseamnă că elementele au ieșit din pagină: dictarea nu mai
  // are unde scrie. Se coboară o treaptă, în AȘTEPT — microfonul rămâne deschis
  // cât e JA.S.Mine deschisă, ca „engage" să aibă cine să-l audă.
  URECHE=null;
  if(U.mod==='engage')intraInAstept(motiv||'panou inchis');
  sheet.classList.remove('open');
  // .mare se scoate DUPĂ ce fereastra s-a stins. Scoasă acum, s-ar vedea cum
  // se micșorează în timp ce dispare.
  setTimeout(()=>{if(!deschis())sheet.classList.remove('mare','plin');},800);
  if(lastFocus)lastFocus.focus();
}
/* `isTrusted` deosebește un click DE OM de unul făcut din cod, iar motivul de
   ieșire din ENGAGE se scrie diferit pentru cele două. Panoul închis „de
   butonul lui" fără ca omul să atingă mouse-ul are nevoie de cifra asta, nu de
   ghicit. */
document.getElementById('closeBtn').onclick=e=>{
  jurnalTrezire('inchis-cu-butonul',
    (e&&e.isTrusted?'click de om':'click din cod')+
    ' · x='+(e&&e.clientX)+' y='+(e&&e.clientY)+' · detail='+(e&&e.detail),null);
  closePanel('butonul panoului');
};
// Minipanoul de sub cursor, sau null. Aceeași geometrie ca la desen — de-aia e
// scrisă într-un singur loc.
