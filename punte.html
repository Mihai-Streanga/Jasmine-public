function miniLa(x,y){
  for(const m of MINI){
    const g=geomMini(m);
    if(y<g.y||y>g.y+g.h)continue;
    // Zona apăsabilă se taie în perete la înălțimea cursorului, nu pe o cutie:
    // altfel colțul care lipsește din formă ar rămâne apăsabil.
    const w=g.marg(y);
    if(g.s<0?(x>=MINI_MARJA&&x<=MINI_MARJA+w):(x<=W-MINI_MARJA&&x>=W-MINI_MARJA-w))return m;
  }
  return null;
}
cv.addEventListener('click',e=>{
  const x=e.clientX,y=e.clientY;
  // Cu fereastra deschisă, clicul din afara ei o închide — inclusiv dacă a
  // nimerit un minipanou. Regula veche, neatinsă: un click pe hartă cu ceva pe
  // ecran înseamnă „scapă-mă de asta", nu „dă-mi altceva".
  if(deschis()){
    const r=sheet.getBoundingClientRect();
    if(x<r.left||x>r.right||y<r.top||y>r.bottom)closePanel('click in afara');
    return;
  }
  const m=miniLa(x,y);
  if(m){openManual(m.k);return;}
  let hit=null,hd=1e9;
  for(const k in NODES){
    const n=NODES[k];
    const d=Math.hypot(x-n.px,y-n.py);
    if(d<n.cr*1.4&&d<hd){hd=d;hit=k;}
  }
  if(hit)openPanel(hit);
});
cv.addEventListener('mousemove',e=>{
  if(deschis()){cv.style.cursor='default';hover=null;hoverMini=null;return;}
  hover=null;
  hoverMini=miniLa(e.clientX,e.clientY);
  if(!hoverMini)for(const k in NODES){
    if(Math.hypot(e.clientX-NODES[k].px,e.clientY-NODES[k].py)<NODES[k].cr*1.4){hover=k;break;}
  }
  cv.style.cursor=(hover||hoverMini)?'pointer':'default';
},{passive:true});
document.querySelectorAll('.a11y button[data-k]').forEach(b=>b.onclick=()=>openPanel(b.dataset.k));
document.querySelectorAll('.a11y button[data-m]').forEach(b=>b.onclick=()=>openManual(b.dataset.m));
/* Contorul se calculează, nu se scrie. Numitorul: câte panouri există în P.
   Numărătorul: câte au wire() — funcția prin care un panou vorbește cu serverul.
   Un panou fără wire() e o pagină de text, oricât de convingător ar suna.

   Nodul aprins din hartă și sistemul activ sunt lucruri diferite: nodul spune
   că locul există (COMMAND e puntea de comandă și rămâne aprins), wire() spune
   că sistemul face ceva. De-asta contorul nu se mai uită la NODES.on. */
const sistemeMoarte=new Set();
/* Unele panouri au wire(), dar wire-ul cheamă ceva din afară, care poate fi oprit
   — RECON cheamă agentul 051. Sondele își scriu verdictul aici. Mulțimea pornește
   goală: nici „viu", nici „mort" nu se presupun de mână.

   Cât o sondă n-a răspuns încă niciodată, contorul afișează „—", nu o cifră.
   O cifră care se corectează singură după o clipă e o afirmație nesusținută,
   exact ce am scos de pe ecran. Sondele se înscriu singure când pornesc, deci
   nu există nicăieri o listă a lor scrisă de mână. */
const sondePornite=new Set(),sondeRaspunse=new Set();
function refaContor(){
  const cnt=document.getElementById('cnt');
  // Doar primul răspuns contează: la repetarea din minut în minut valoarea e
  // deja știută, deci contorul nu mai clipește pe „—" la fiecare sondaj.
  if(sondeRaspunse.size<sondePornite.size){cnt.textContent='—';return;}
  const chei=Object.keys(P);
  const active=chei.filter(k=>typeof P[k].wire==='function'&&!sistemeMoarte.has(k)).length;
  cnt.textContent=active+'/'+chei.length;
}
refaContor();
/* ── Harta nu minte despre agent ─────────────────────────────────────
   UN SINGUR SCRIITOR pentru nodul RECON: aprinderea, culoarea, eticheta,
   conducta și contorul. Doi scriitori ajung să dea aceeași stare cu două
   etichete, iar unul uită conducta.

   Sursa e sonda din `/api/stare` (`sondeaza_agent_051`), cu o unealtă
   adevărată: întrebată o dată la încărcare, apoi la 60 s. Panoul RECON scrie
   tot pe aici când află ceva.

   Stările se repară în locuri diferite, deci se spun diferit:
     lucrează  — o rulare e în curs; agentul nu răspunde la nimic altceva
     activ     — a răspuns
     ocupat    — n-a răspuns la timp, dar portul acceptă conexiuni; „ocupat"
                 și „blocat" nu se deosebesc din afară
     eroare    — a răspuns cu eșec: NU se repară pornindu-l
     stins     — portul e închis */
// Capătul poate fi oricare din cele două: ordinea din LINKS o dictează curbura,
// nu apartenența. Căutat doar pe l[0], sonda ar rata legătura scrisă invers.
const legRecon=LINKS.find(l=>l[0]==='recon'||l[1]==='recon');
function arataAgentul(a){
  const n=NODES.recon;
  // Cât rulează lanțul, agentul nu răspunde la sondă — dar e viu și muncește.
  const lucreaza=!!(a.lucreaza||RECON_STARE.pornit);
  const viu=lucreaza||!!a.viu;
  const esueaza=!lucreaza&&viu&&!!a.raspunde_dar_esueaza;
  n.on=viu?1:0;
  n.hue=viu?'lamp':'ice';
  n.tag=lucreaza?'agent · lucrează':!viu?'agent · stins'
    :esueaza?'agent · răspunde cu eroare':a.ocupat?'agent · ocupat sau blocat':'agent · activ';
  if(legRecon)legRecon[2]=viu?1:0;
  // Contorul numără sistemele care fac ce trebuie: un agent care răspunde cu
  // eroare e viu pe hartă, dar nu e activ.
  if(viu&&!esueaza)sistemeMoarte.delete('recon');else sistemeMoarte.add('recon');
  refaContor();
}
function sondaAgent(){
  sondePornite.add('recon');
  fetch('/api/stare').then(r=>r.json())
    .then(d=>arataAgentul((d&&d.servere&&d.servere.agent_051)||{viu:false}))
    .catch(()=>arataAgentul({viu:false}))
    .finally(()=>{sondeRaspunse.add('recon');refaContor();});
}
sondaAgent();
setInterval(sondaAgent,60000);

/* ── Harta nu minte despre motorul de conversație ────────────────────
   Între clipa în care serverul răspunde și clipa în care Sky poate răspunde trec
   ~9–12 s. O spune CULOAREA, nu un mesaj de eroare de după: rece cât motorul
   pornește, portocaliu când poate răspunde.

   Culoarea poate atârna de sonda asta fiindcă sonda (`GET /health`),
   `/api/models` și primul mesaj reușit se aprind în ACEEAȘI probă de 0,6 s:
   nu există interval în care sonda e verde și Sky tace.

   Pentru COMMAND, „poate răspunde" nu e destul — mai trebuie și să audă:
   culoarea lui se face în `refaCmd()`. Aici rămân AGORA și MUNTELE. */
function seteazaMotor(viu,cum){
  MOTOR.viu=viu;MOTOR.cum=cum||null;
  // AGORA și MUNTELE se aprind de aici, amândouă. COMMAND cere și urechea, iar
  // culoarea lui se reface în `tagCmd`.
  //
  // MUNTELE e în aceeași categorie cu AGORA: și Ramana vorbește prin Open WebUI,
  // și la el se SCRIE. Cât e camera deschisă urechea tace anume; un nod care
  // s-ar răci fiindcă el însuși a oprit urechea ar fi o hartă care se contrazice.
  for(const k of ['agora','munte']){
    NODES[k].on=viu?1:0;
    NODES[k].hue=viu?'lamp':'ice';
  }
  // Fiecare își spune numele stratului când merge; COMMAND trece prin `tagCmd`,
  // ca dictarea și motorul să nu se bată pe același câmp.
  NODES.agora.tag=viu?'Socrate':etichetaMotor();
  NODES.munte.tag=viu?'Ramana':etichetaMotor();
  tagCmd('');
}
/* Ritmul are două trepte, ca pauzele paznicului de sincronizare: cât e rece se
   întreabă la 2 secunde — cifra e `TREZIRE_PAUZA`, aceeași fereastră de pornire
   — iar după ce s-a aprins, la 60 de secunde, ca sonda RECON. A doua treaptă nu
   e decor: dacă Docker moare în timpul zilei, harta o spune fără să fie
   întrebată, exact ca la agent.

   `/api/motor`, nu `/api/stare`: al doilea sondează și agentul 051 cu un apel
   MCP adevărat, iar ăla se întreabă o dată la încărcare, nu de zece ori la
   fiecare pornire. */
const MOTOR_RECE=2000, MOTOR_CALD=60000;
let motorCeas=null;
function sondaMotor(){
  fetch('/api/motor').then(r=>r.json())
    .then(d=>{const m=(d&&d.motor)||{};seteazaMotor(!!m.viu,m.cum);})
    .catch(()=>seteazaMotor(false,MOTOR.cum))
    .finally(()=>{
      // Ceasul se reașează după FIECARE răspuns, nu la interval fix: altfel
      // trecerea de la 2 s la 60 s ar cere două `setInterval` care se suprapun.
      clearTimeout(motorCeas);
      motorCeas=setTimeout(sondaMotor,MOTOR.viu?MOTOR_CALD:MOTOR_RECE);
    });
}
sondaMotor();
// Tabelul de straturi se cere o dată, la încărcare. Panourile de chat nu se pot
// desena fără el; dacă nu vine, ele o spun, iar wire() mai încearcă o dată.
cereStraturi();
frame();

/* JA.S.Mine începe ascultând. Deschizi fereastra și microfonul e deja deschis, în
   AȘTEPT — nu e nimic de apăsat ca să poți spune „engage".

   Fără reîncercare, urechea ar rata fereastra de pornire și ar rămâne stinsă
   până la reîncărcarea paginii — un eșec pe care nimic nu l-ar arăta, într-o
   fereastră fără bară.

   Serverul răspunde din prima secundă, iar modelul se încarcă în fundal:
   `se_incarca` vine de la server și spune singur cât mai e de așteptat.
   Plafonul rămâne numai pentru cazul în care nu răspunde nimeni, fiindcă acolo
   chiar n-avem niciun semnal. */
const TREZIRE_REINCERCARI=20, TREZIRE_PAUZA=2000;
async function armeazaTrezirea(n){
  n=n||1;
  if(U.pornita)return;
  let d=null;
  try{d=await (await fetch('/api/dictare')).json();}catch(e){}

  // Reglajele se rețin chiar dacă urechea nu pornește: cuvintele de adormire
  // sunt acolo, iar ușa TASTATĂ merge și fără ureche, și fără iGPU.
  if(d&&d.ok)U.reglaje=d;

  if(d&&d.ok&&d.gata&&d.trezire){pornesteUrechea('astept');return;}

  // Dictarea merge, dar trezirea nu e de făcut: ori lipsesc cuvintele din
  // dictare.json, ori iGPU-ul e mort și fiecare probă ar costa ~13 s de
  // procesor pe rezervă, în loc de ~0,25. Nu se reîncearcă — nu se schimbă
  // singur. Rămâne Alt+A, întreg.
  if(d&&d.ok&&d.gata&&!d.trezire){
    console.warn('trezire: nu e disponibilă, rămâne Alt+A');
    urecheaTace('trezirea nu e pornită');
    return;
  }

  /* Serverul răspunde, dar dictarea nu e gata. Două lucruri diferite, și
     serverul le deosebește: `se_incarca` înseamnă „mai așteaptă", lipsa lui
     înseamnă „a picat, și n-are de ce să se schimbe singur". Fără distincție,
     o compilare căzută ar ține „pornesc…" pe ecran, iar o încărcare lentă ar fi
     declarată eșec exact înainte să reușească. */
  if(d&&d.ok&&!d.gata&&!d.se_incarca){
    console.warn('dictare: nu s-a încărcat —', d.motiv||'fără motiv');
    urecheaTace('dictarea nu e pornită');
    return;
  }
  // Plafonul se consumă DOAR când n-a răspuns nimeni: acolo nu există semnal,
  // deci nu există altceva de numărat decât încercările.
  if(!(d&&d.ok)&&n>=TREZIRE_REINCERCARI){
    urecheaTace('dictarea nu e pornită');
    return;
  }
  // Mai vine. Motivul se golește ca eticheta să cadă pe implicitul care merge
  // cu culoarea („motorul pornește" cât e rece și el, altfel „urechea
  // pornește") — un singur text pentru o singură stare, în loc de „pornesc…"
  // pe lângă el.
  urecheaTace('');
  setTimeout(()=>armeazaTrezirea(n+1),TREZIRE_PAUZA);
}
armeazaTrezirea();
