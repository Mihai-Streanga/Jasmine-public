:root{
  --hull:#06080C;
  --live:#E7DDC8;
  --lamp:#F0A342;
  --ice:#9FD4F5;
  --ice-dim:#5E7E96;
  /* Chihlimbariu de accent — mai aprins decât --lamp, pentru ce cere ochiul
     ACUM: butonul principal din RECON, pragul de tokeni. O variabilă nedefinită
     nu dă eroare, doar înghite regula în tăcere. */
  --gold:#FFC46B;
  /* Roșul irisului, același cu `IRIS` din desen (192,86,58). */
  --iris:#C0563A;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --lbl:"Saira Condensed",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--hull);color:var(--ice);font-family:var(--mono);-webkit-font-smoothing:antialiased}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud-top{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;padding:20px 28px}
/* Fără `text-transform:uppercase`: forma citită a numelui e `JA.S.Mine`, cu
   majuscule exact pe cele trei straturi, iar `uppercase` ar șterge distincția. */
/* Literele mici — restul numelui — pe roșu; `JA`, `S` și `M` rămân chihlimbarii,
   fiindcă ele sunt cele trei straturi, iar chihlimbariul înseamnă „viu". */
.mark{font-family:var(--lbl);font-weight:700;font-size:24px;letter-spacing:.46em;text-transform:none;color:var(--iris)}
.mark span{color:var(--lamp)}
/* Data stelară și rândul „SISTEME ACTIVE N" sunt pe roșul irisului: pe punte nu
   e nimic argintiu. Se schimbă CLASELE, nu `--ice-dim`: variabila e citită de
   vreo cincisprezece locuri din panouri, bule și liste. `--iris` are contrast
   4,4:1 pe `--hull`, `--ice-dim` 4,7:1 — aceeași greutate, altă nuanță. Cifra
   din `.hud-r b` rămâne chihlimbarie: ea e ce se citește, restul e etichetă. */
.sub{font-size:10px;color:var(--iris);letter-spacing:.08em;margin-top:6px}
.hud-r{font-family:var(--lbl);font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--iris);text-align:right;line-height:1.8}
.hud-r b{color:var(--lamp);font-weight:600}
/* `pointer-events:auto` fiindcă .hud-top e transparentă la mouse — altfel
   click-ul ar trece prin buton și ar ateriza pe hartă. */
.x{pointer-events:auto;background:transparent;border:0;cursor:pointer;
   color:var(--ice-dim);font-family:var(--mono);font-size:20px;line-height:1;
   padding:6px 2px 0;opacity:.45;transition:opacity .2s,color .2s}
.x:hover,.x:focus-visible{opacity:1;color:var(--iris)}
.hud-bot{position:fixed;bottom:0;left:0;right:0;z-index:5;pointer-events:none;font-size:9.5px;color:#3A4C5C;letter-spacing:.05em;padding:14px 28px;text-align:center;line-height:1.7}
.sheet{position:fixed;left:5%;top:50%;z-index:20;width:min(430px,44vw);max-height:74vh;transform:translateY(-50%) translateX(-30px);opacity:0;pointer-events:none;background:rgba(8,13,19,.78);backdrop-filter:blur(4px);border:1px solid rgba(159,212,245,.22);border-left:2px solid var(--lamp);padding:22px 26px 24px;display:flex;flex-direction:column;transition:opacity .4s ease .2s,transform .55s cubic-bezier(.22,.9,.24,1) .2s}
.sheet.open{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0)}
.sheet h2{font-family:var(--lbl);font-weight:600;font-size:19px;letter-spacing:.3em;text-transform:uppercase;color:var(--ice)}
.sheet .st{font-size:11.5px;color:var(--ice-dim);margin-top:6px;letter-spacing:.05em}
.sheet .sc{margin-top:16px;overflow-y:auto;flex:1;min-height:0}
/* Bara de derulare stă ÎN panou, deci ar mânca din marginea dreaptă. Marginea
   negativă lărgește zona de derulat până aproape de ramă, iar padding-ul aduce
   conținutul înapoi la aceeași distanță ca în stânga: bara trăiește în marginea
   din dreapta, nu în coloana de citit.
   Doar panourile mici: la cele mari derularea e pe zona de mesaje, nu pe .sc. */
.sheet:not(.mare) .sc{margin-right:-19px;padding-right:19px;
  scrollbar-width:thin;scrollbar-color:rgba(159,212,245,.30) transparent}
.close{position:absolute;top:14px;right:16px;background:transparent;border:0;color:var(--ice-dim);cursor:pointer;font-family:var(--lbl);font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:4px 6px;pointer-events:auto}
.close:hover,.close:focus-visible{color:var(--lamp);outline:none}
.row{display:grid;grid-template-columns:1fr auto;gap:14px;padding:10px 0;border-top:1px solid rgba(94,126,150,.26);font-size:13px;align-items:baseline;color:var(--live)}
.row:first-child{border-top:0}
.row .v{color:#8AAAC2;font-size:12px;white-space:nowrap}
.row .v.w{color:var(--lamp)}
.need{font-size:13px;color:var(--live);line-height:1.85;font-weight:500}
.need em{font-style:normal;color:#8FADC2}
.fld{display:flex;gap:8px;margin-bottom:13px}
input{flex:1;background:rgba(4,7,10,.85);border:1px solid rgba(94,126,150,.35);color:var(--ice);font-family:var(--mono);font-size:12px;padding:10px 12px}
input::placeholder{color:#4A6072}
input:focus{outline:none;border-color:var(--lamp)}
.btn{font-family:var(--lbl);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--lamp);border:1px solid var(--lamp);padding:0 14px}
.btn:hover{background:rgba(240,163,66,.12)}
.btn:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.hint{font-size:11px;color:#7089A0;margin-top:11px;line-height:1.6}
.empty{font-size:12.5px;color:#8FADC2;padding:4px 0}
/* SENSORS. Nu .row, care e făcut pentru perechi cheie-valoare pe două coloane:
   un titlu de știre are nevoie de toată lățimea, altfel se rupe în trei rânduri
   înghesuite lângă o oră. Aici titlul e linkul, iar sursa și ora stau dedesubt. */
.stire{padding:9px 0;border-top:1px solid rgba(94,126,150,.26);font-size:13px;line-height:1.5;color:var(--live)}
.stire:first-child{border-top:0}
.stire a{color:var(--live);text-decoration:none;border-bottom:1px solid rgba(94,126,150,.4)}
.stire a:hover{color:var(--lamp);border-bottom-color:var(--lamp)}
.stire .m{font-size:11px;color:#7089A0;margin-top:3px;letter-spacing:.04em}
/* Ce a spus deja Sky rămâne pe ecran, dar stins: informația există oricum, iar
   ascunsă ar face panoul să pară că pierde știri. */
.stire.spusa{opacity:.45}
.grup{font-family:var(--lbl);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--lamp);margin:16px 0 2px}
.grup.sus{margin-top:4px}

/* ── Fereastra mare ──────────────────────────────────────────────────
   Doar panourile care cer `mare:true`. Celelalte rămân la 430px: un panou
   de citit nu câștigă nimic din lățime, doar rânduri lungi și obositoare.
   Aici înălțimea e FIXĂ, nu max-height: dimensionat după conținut, chatul
   ar crește cu fiecare replică și câmpul de scris ar sălta sub degete.
   Cei 880px sunt lățimea la care coloana de conversații încape FĂRĂ să
   fure din citit: bula rămâne la ~61 de caractere pe rând. */
.sheet.mare{width:min(880px,68vw);height:78vh;max-height:78vh}
/* Sub pragul din JS (vezi PRAG_LISTA) fereastra se îngustează. Pe ecran mic
   lizibilitatea bate vizibilitatea listei: 880px într-o fereastră de 1280 ar
   acoperi nodul și ar strânge bula. */
.sheet.mare.ingust{width:min(660px,56vw)}
/* Derularea coboară în zona de mesaje. Lăsată pe .sc, ar duce câmpul de
   scris în afara ecranului odată cu mesajele vechi. */
.sheet.mare .sc{overflow:hidden;display:flex;flex-direction:column}

/* ── Chat ────────────────────────────────────────────────────────────
   Bulele nu sunt colorate ca la mesagerie: doar o margine subțire care
   spune cine vorbește. Omul la dreapta, chihlimbariu; Socrate la stânga,
   gheață. Textul rămâne aliniat la stânga în ambele — un răspuns de zece
   rânduri aliniat la dreapta nu se citește. */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.chat-bar{display:flex;align-items:center;gap:12px;padding-bottom:11px;border-bottom:1px solid rgba(94,126,150,.26)}
.chat-tit{flex:1;font-size:12.5px;color:var(--live);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-tok{font-size:11px;color:var(--ice-dim);white-space:nowrap;letter-spacing:.04em}
.chat-tok.mult{color:var(--gold)}
.chat-lung{font-size:10.5px;color:var(--gold);letter-spacing:.04em;padding:8px 0 0;text-align:right}
.chat-mij{flex:1;min-height:0;display:flex;gap:16px;position:relative}
.msgs{flex:1;min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:16px 2px}

/* ── Lista conversațiilor ────────────────────────────────────────────
   Coloană fixă la lățime, nu procentuală: crescând cu fereastra ar fura
   din citit exact acolo unde e mai scump. */
.lista{flex:0 0 180px;overflow-y:auto;padding:14px 12px 14px 0;border-right:1px solid rgba(94,126,150,.22)}
/* Sub prag devine sertar peste zona de mesaje, deschis din buton. Fundal
   aproape opac: sub el stau mesajele, nu peretele navei. */
.sheet.mare.ingust .lista{position:absolute;left:0;top:0;bottom:0;z-index:3;width:212px;flex:none;
  background:rgba(6,10,15,.97);border-right:1px solid rgba(159,212,245,.3);padding:14px 12px;display:none}
.sheet.mare.ingust .lista.desfasurata{display:block}
/* Butonul „Conversații" există doar cât lista nu încape lângă mesaje. */
.doar-ingust{display:none}
.sheet.mare.ingust .doar-ingust{display:block}
.conv{position:relative;padding:9px 24px 9px 10px;cursor:pointer;border-left:2px solid transparent}
.conv:hover{background:rgba(159,212,245,.06)}
.conv.acum{border-left-color:var(--gold);background:rgba(255,196,107,.07)}
.conv.acum .conv-t{color:var(--gold)}
.conv-t{font-size:12px;line-height:1.5;color:var(--live);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-m{font-size:10px;letter-spacing:.03em;color:var(--ice-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* × apare la hover, dar rămâne ajuns din tastatură: focus-visible îl scoate. */
.conv-x{position:absolute;top:6px;right:3px;background:transparent;border:0;color:var(--ice-dim);
  font-family:var(--mono);font-size:14px;line-height:1;padding:3px 5px;cursor:pointer;opacity:0}
.conv:hover .conv-x{opacity:.65}
.conv-x:hover{opacity:1;color:#C0563A}
.conv-x:focus-visible{opacity:1;outline:1px solid var(--lamp)}
/* Jurnalul stă pe două rânduri per idee: sus data și ×, dedesubt textul, întins
   pe toată lățimea; pe un singur rând textul s-ar strânge într-o coloană
   îngustă. × e cât data, nu mai mare: e un gest de curățenie, nu un buton.
   Stins, aprins la hover, ca la conversații. */
.row.log-r{display:block}
.log-cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
/* × exact cât data și în aceeași culoare: aceeași familie de litere (nu mono),
   12px, var(--lamp). Roșu numai sub mouse, când chiar e pe cale să scoată ceva. */
.log-r .conv-x{position:static;font-family:inherit;font-size:12px;color:var(--lamp);
  padding:0 0 0 8px}
.log-r:hover .conv-x{opacity:1}
.log-r .conv-x:hover{color:#C0563A}
/* Aliniat pe amândouă marginile. Despărțirea în silabe nu e podoabă: fără ea,
   „justify" pe o coloană îngustă lasă găuri albe între cuvinte. Merge fiindcă
   <html lang="ro"> e scris — altfel Chrome n-ar ști după ce reguli să despartă. */
.log-t{line-height:1.7;text-align:justify;hyphens:auto}
.lista-nota{font-size:10.5px;color:#7089A0;line-height:1.5;padding:0 0 10px 10px}
.bula{max-width:82%;font-size:13.5px;line-height:1.8;color:var(--live)}
.bula .cine{font-family:var(--lbl);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ice-dim);margin-bottom:6px}
.bula.om{align-self:flex-end;border-right:2px solid var(--lamp);padding-right:13px}
.bula.om .cine{text-align:right;color:var(--lamp)}
.bula.voce{align-self:flex-start;border-left:2px solid rgba(159,212,245,.45);padding-left:13px}
.bula.rea{align-self:flex-start;border-left:2px solid #C0563A;padding-left:13px;color:#D9977E;font-size:12.5px}
.bula.rea .cine{color:#C0563A}
.bula .nota{font-size:10.5px;color:var(--gold);letter-spacing:.04em;margin-top:8px;opacity:.85}
/* Linkurile din replici — vezi `corp()`. Adresa se rupe oriunde: un URL de
   știre românească e titlul întreg scris cu cratime și ar lăți bula peste
   ecran. */
.bula a{color:var(--lamp);text-decoration:none;border-bottom:1px solid rgba(240,163,66,.45);word-break:break-all}
.bula a:hover{border-bottom-color:var(--lamp)}
/* ── MUNTELE: clipul ─────────────────────────────────────────────────
   Clipul sus, conversația dedesubt: chatul peste clip ar fi greu de urmărit.

   `flex:0 0 auto` plus `aspect-ratio`, nu o înălțime scrisă în pixeli: clipurile
   au formate diferite (320x240, 1280x720, 480x360), iar o cutie fixă ar pune
   chenare negre. Rama ține 16/9, iar `object-fit:contain` lasă fiecare clip să
   intre în ea fără să fie tăiat. Plafon pe înălțime, ca pe o fereastră joasă să
   rămână loc de conversație. */
.munte-clip{position:relative;flex:0 0 auto;aspect-ratio:16/9;max-height:42%;
  background:#05080c;border:1px solid rgba(159,212,245,.16);overflow:hidden;cursor:pointer}
.munte-clip video{width:100%;height:100%;object-fit:contain;display:block}
/* Semnul de stare. Regula „fără butoane" nu e încălcată: apăsabil e CLIPUL, ca
   un nod sau un minipanou, iar ăsta e semnul lui — nu un control adăugat.
   Există fiindcă altfel starea ar fi ascunsă: un clip oprit pe un cadru
   fix nu se deosebește de unul care încă nu a pornit. */
.munte-semn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .35s ease;pointer-events:none;background:rgba(5,8,12,.34)}
.munte-clip:hover .munte-semn,.munte-clip.stat .munte-semn{opacity:1}
.munte-semn i{display:block;width:0;height:0;border-style:solid;
  border-width:13px 0 13px 22px;border-color:transparent transparent transparent var(--live);opacity:.9}
.munte-clip:not(.stat) .munte-semn i{width:20px;height:26px;border:none;
  border-left:7px solid var(--live);border-right:7px solid var(--live);opacity:.75}
/* Titlul clipului, jos-stânga. Se citește din munte.json, nu se tastează. */
.munte-tit{position:absolute;left:0;right:0;bottom:0;padding:16px 13px 7px;
  font-family:var(--lbl);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ice-dim);pointer-events:none;
  background:linear-gradient(to top,rgba(5,8,12,.82),rgba(5,8,12,0))}
/* Camera fără clipuri pe disc nu e o camera stricată: chatul merge întreg.
   De-asta rama spune ce lipsește și cum se repară, în loc să dispară. */
.munte-fara{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:0 26px;font-size:11.5px;line-height:1.7;color:var(--ice-dim)}
/* `display:flex` de mai sus BATE `[hidden]{display:none}` din foaia browserului —
   o clasă din pagină învinge o regulă de agent utilizator la specificitate egală.
   Fără rândul ăsta, `m-fara` rămâne întins peste tot clipul (`inset:0`) chiar și
   ascuns: invizibil, dar DEASUPRA barei de comenzi, deci volumul și clipul
   următor nu mai primesc clicul — cade pe el și urcă la clip, adică pauză. */
.munte-fara[hidden]{display:none}
/* ── Fereastra PLINĂ ─────────────────────────────────────────────────
   Camera MUNTELE e singura în care stai, nu în care ceri ceva — harta din spate
   ar fi zgomot.

   Se pune peste `.mare`, nu în locul lui: chatul de dedesubt atârnă de regulile
   lui `.sheet.mare .sc` și `.sheet.mare.ingust .lista`. De-aia selectoarele
   poartă și `.mare` — aceeași specificitate ca `.mare.ingust`, dar scrise mai
   jos, deci câștigă. Varianta `.ingust` e scrisă explicit, cu o clasă în plus,
   ca să nu atârne de ordine.

   Fondul e aproape opac (.97), nu blur: pe tot ecranul, `backdrop-filter` costă
   la fiecare cadru, iar în spate oricum nu mai trebuie să se vadă nimic. */
.sheet.mare.plin{left:0;top:0;width:100vw;height:100vh;max-height:100vh;
  border:none;background:rgba(5,8,12,.97);backdrop-filter:none;
  padding:22px 34px 26px;transform:translateX(-30px)}
.sheet.mare.plin.ingust{width:100vw}
.sheet.mare.plin.open{transform:translateX(0)}
/* Conținutul nu se lățește cât ecranul: pe un monitor lat, bulele de conversație
   ar traversa un metru de sticlă. Rama rămâne centrată. */
.sheet.mare.plin .sc{max-width:1180px;width:100%;margin-left:auto;margin-right:auto}
.sheet.mare.plin h2,.sheet.mare.plin .st{max-width:1180px;margin-left:auto;margin-right:auto;width:100%}
.sheet.mare.plin .munte-clip{max-height:46vh}
/* ── Bara de comenzi a clipului ──────────────────────────────────────
   Volumul și trecerea la clipul următor: camera e un player.

   Clipul întreg e deja suprafața de pauză, deci comenzile trebuie să fie o
   suprafață SEPARATĂ, în colț — altfel fiecare atingere a volumului ar pune și
   pauză. Apare la hover, ca semnul de pauză. Amândouă stau în ACEEAȘI ramă:
   apărarea împotriva pauzei accidentale e scrisă o dată (vezi `legClipul`).

   Volumul NU stă în pagină: pleacă în `munte.json`, prin `/api/munte/volum`.
   Un volum ținut în browser ar dispărea la golirea cache-ului kiosk-ului, care
   se face la fiecare pornire. Fără stare ascunsă în interfețe. */
.munte-cmd{position:absolute;right:11px;bottom:9px;display:flex;align-items:center;gap:10px;
  padding:5px 10px;background:rgba(5,8,12,.7);opacity:0;transition:opacity .35s ease}
.munte-clip:hover .munte-cmd,.munte-cmd:focus-within{opacity:1}
.munte-cmd span{font-family:var(--lbl);font-size:9px;letter-spacing:.16em;color:var(--ice-dim)}
.munte-cmd input{-webkit-appearance:none;appearance:none;width:104px;height:3px;
  background:rgba(159,212,245,.28);outline:none;cursor:pointer}
.munte-cmd input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:11px;height:11px;border-radius:50%;background:var(--lamp);cursor:pointer}
/* Semnul de „clipul următor": triunghi plus bară, desenate din `border`, ca
   semnul de pauză de mai sus. Un caracter (⏭) ar atârna de fontul de sistem,
   iar puntea nu cere nimic din afară ca să se deseneze. */
.munte-next{position:relative;width:15px;height:12px;cursor:pointer;opacity:.7;
  transition:opacity .2s ease}
.munte-next:hover{opacity:1}
.munte-next::before{content:'';position:absolute;left:0;top:0;width:0;height:0;
  border-style:solid;border-width:6px 0 6px 10px;
  border-color:transparent transparent transparent var(--ice-dim)}
.munte-next:hover::before{border-left-color:var(--lamp)}
.munte-next::after{content:'';position:absolute;right:0;top:0;width:2px;height:12px;
  background:var(--ice-dim)}
.munte-next:hover::after{background:var(--lamp)}
/* Urma unui apel de unealtă. Nu e o replică, deci nu e bulă: e o notă între
   ele, care spune de unde vin cifrele din răspunsul de dedesubt. */
.unealta{align-self:center;font-size:10.5px;letter-spacing:.06em;color:var(--gold);opacity:.75;padding:2px 0}
.scrie{align-self:flex-start;font-size:12px;color:var(--ice-dim);letter-spacing:.06em;animation:puls 1.4s ease-in-out infinite}
@keyframes puls{0%,100%{opacity:.42}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.scrie{animation:none;opacity:.8}}
/* Bara NU măsoară progresul: agentul nu raportează pașii, iar o bară care
   pretinde 40% când nimeni nu știe cât e ar minți mai rău decât tăcerea.
   Spune un singur lucru — „lucrează, nu a înghețat" — care e tot ce lipsea. */
.bara{height:3px;border-radius:2px;background:rgba(94,126,150,.22);overflow:hidden;margin:12px 0}
.bara i{display:block;height:100%;width:32%;background:var(--gold);animation:curge 1.7s ease-in-out infinite}
@keyframes curge{0%{transform:translateX(-110%)}100%{transform:translateX(350%)}}
@media (prefers-reduced-motion:reduce){.bara i{animation:none;width:100%;opacity:.45}}
/* Butonul stă pe fundul câmpului, nu întins pe toată înălțimea lui: la patru
   rânduri, un TRIMITE de 120px ar fi o placă de chihlimbariu mai grea decât
   conversația. Înălțimea lui e cea din restul punții. */
.compune{display:flex;gap:8px;align-items:flex-end;padding-top:12px;border-top:1px solid rgba(94,126,150,.26)}
.compune .btn{flex:0 0 auto;height:40px}
/* Ce scrii trebuie să arate ca ce citești: aceleași cifre ca la .bula, puse
   explicit. `font:inherit` mai întâi — șterge fontul implicit de formular al
   browserului, care nu se moștenește de la body ca restul paginii.
   Înălțimea e derivată, nu ghicită: 4 rânduri × 1.8 = 7.2em, plus 20px padding
   și 2px chenar (box-sizing e border-box peste tot). Schimbi line-height-ul,
   se mută și fundul câmpului odată cu el. */
textarea{flex:1;font:inherit;font-size:13.5px;line-height:1.8;background:rgba(4,7,10,.85);border:1px solid rgba(94,126,150,.35);color:var(--ice);padding:10px 12px;resize:none;height:calc(7.2em + 22px)}
textarea::placeholder{color:#4A6072}
textarea:focus{outline:none;border-color:var(--lamp)}
textarea:disabled{opacity:.45}

/* ── Manualul ────────────────────────────────────────────────────────
   Refolosește tot ce are chatul — `.chat`, `.msgs`, `.bula` — fiindcă manualul
   se citește ca o conversație, nu ca o fișă. Două diferențe, ambele fiindcă
   aici nu vorbește nimeni: bula se întinde pe toată lățimea și nu există câmp
   de scris. `.cine` spune ce fel de lucru e dedesubt („CE FACE"), nu cine l-a
   spus. */
.msgs.man .bula{max-width:100%}
.msgs.man .bula.voce{border-left-color:rgba(192,86,58,.55)}
.msgs.man .bula .cine{color:rgba(192,86,58,.9)}
.msgs.man .bula b{color:var(--lamp);font-weight:600}
.msgs.man .bula code{font-family:var(--mono);font-size:12px;color:#8FADC2}
/* Bulele intră una după alta, ca un răspuns care se scrie. Cu mișcarea redusă
   nu intră deloc — apar toate odată, ceea ce e tot un răspuns, doar tăcut. */
@keyframes apare{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.bula.apare{animation:apare .34s cubic-bezier(.22,.9,.24,1)}
@media (prefers-reduced-motion:reduce){.bula.apare{animation:none}}

.a11y{position:fixed;left:-9999px;top:0}
.a11y:focus-within{left:12px;top:64px;z-index:50;background:#0A1017;border:1px solid var(--lamp);padding:10px}
.a11y button{display:block;background:none;border:0;color:var(--ice);font-family:var(--mono);font-size:12px;padding:4px 6px;cursor:pointer}
.a11y button:focus-visible{outline:1px solid var(--lamp)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud-top">
  <!-- Numele asistentului, nu al încăperii. Lampa cade pe cele trei litere care
       poartă înțelesul: JArvis · Socrate · Maharshi. Încăperea AGORA rămâne pe
       hartă, în stânga-jos. -->
  <div><div class="mark"><span>JA</span>.<span>S</span>.<span>M</span>ine</div><div class="sub" id="stardate"></div></div>
  <div class="hud-r">Sisteme active <b id="cnt">—</b><br>Punte
    <!-- Închiderea are nevoie de un loc VĂZUT: Escape minimizează, deci altfel
         n-ar exista niciun drum afară pe care să-l știi fără să ți-l amintești.
         Un × în colț, stins, care se aprinde sub mouse: e singurul buton de pe
         hartă, și există fiindcă e singurul gest care n-are altă ușă. -->
    <br><button id="inchide" class="x" title="Închide JA.S.Mine">×</button>
  </div>
</div>
<div class="hud-bot">Server JA.S.Mine · localhost:8000 — motorul: Open WebUI, în sala mașinilor. Panourile nu au voce: fapte, nu judecăți.</div>
<nav class="a11y" aria-label="Sisteme">
  <button data-k="cmd">Command</button><button data-k="eng">Engineering</button>
  <button data-k="log">Ship's log</button><button data-k="comms">Comms</button>
  <button data-k="sensors">Sensors</button><button data-k="recon">Recon</button>
  <button data-k="agora">Agora — Socrate</button><button data-k="munte">Muntele — Ramana</button>
  <button data-k="amfi">Amfiteatrul</button>
</nav>
<!-- Minipanourile de perete se apasă cu mouse-ul; asta e ușa lor de tastatură.
     Manualul întregii aplicații stă primul, ca pe perete. -->
<nav class="a11y" aria-label="Manuale">
  <button data-m="manual">Manual — JA.S.Mine</button><button data-m="cmd">Manual — Command</button>
  <button data-m="comms">Manual — Comms</button><button data-m="sensors">Manual — Sensors</button>
  <button data-m="log">Manual — Ship's log</button><button data-m="eng">Manual — Engineering</button>
  <button data-m="recon">Manual — Recon</button><button data-m="agora">Manual — Agora</button>
  <button data-m="amfi">Manual — Amfiteatrul</button><button data-m="munte">Manual — Muntele</button>
</nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <button class="close" id="closeBtn">Închide</button>
  <h2 id="sh-n"></h2><div class="st" id="sh-s"></div><div class="sc" id="sh-c"></div>
</div>
<script>
"use strict";
const cv=document.getElementById('scene'),cx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

/* Razele nodurilor sunt în pixeli, pozițiile în fracțiuni din înălțime. Pe un
   ecran scund nodurile ar rămâne la fel de mari și etichetele s-ar încăleca.
   Nodurile se micșorează odată cu fereastra; peste 1000px de înălțime nu se
   schimbă nimic. */
const scaraNod=()=>Math.min(1,H/1000);

const luni=['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','nov','dec'];
const d0=new Date();
document.getElementById('stardate').textContent='LOG '+String(d0.getDate()).padStart(2,'0')+' '+luni[d0.getMonth()]+' '+d0.getFullYear()+' · '+String(d0.getHours()).padStart(2,'0')+':'+String(d0.getMinutes()).padStart(2,'0');
const stamp=d=>String(d.getDate()).padStart(2,'0')+' '+luni[d.getMonth()]+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
/* Tokenii, scurt, pentru rândurile din lista de conversații: „6.920 tok" nu
   încape în coloană, „6,9k" încape și la 127k. Cifra exactă rămâne în bara de
   sus a conversației deschise; în listă contează ordinul de mărime. Virgulă
   zecimală, nu punct: româna. */
const scurtTok=n=>{
  if(n<1000)return String(n);
  const k=n/1000;
  // Pragul e pe valoarea rotunjită, nu pe cea brută: altfel 99.999 ar da
  // „100,0k", care are o zecimală degeaba.
  return (k<99.95?k.toFixed(1).replace('.',','):Math.round(k))+'k';
};
const esc=s=>s.replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
// Link venit din afară (RSS, mail): ancoră numai pentru http(s), altfel text.
// Un `javascript:` ar rula în originea punții, cu acces la toate API-urile.
const linkSigur=(url,text,stil)=>/^https?:\/\//i.test(url||'')
  ?'<a href="'+esc(url)+'" target="_blank" rel="noopener"'+(stil?' style="'+stil+'"':'')+'>'+text+'</a>'
  :text;

const jurnal=[];

/* Sub lățimea asta lista nu mai încape lângă mesaje fără să strângă bula sub
   ce se citește comod, iar fereastra largă ar ajunge peste nodul selectat.
   Un singur prag, citit și de CSS (prin clasa .ingust) și de canvas — două
   valori scrise separat s-ar despărți la prima ajustare. */
const PRAG_LISTA=1250;
const larg=()=>innerWidth>=PRAG_LISTA;

const NODES={
  // Harta e așezată pe registre, nu pe simetrie. Sus și la mijloc, lumea de
  // navă; jos, lumea grecească. SHIP'S LOG stă între ele fiindcă asta și e:
  // consemnează fapte (navă) și hrănește vocile (grecesc).
  //
  // Coloana din mijloc, de sus în jos: COMMAND — SHIP'S LOG — rândul grecesc.
  //
  // COMMAND e RECE la construcție: aprins abia când JA.S.Mine poate și răspunde,
  // și asculta. După ce serverul răspunde mai trec ~9–12 s până poate răspunde
  // Sky, iar dictarea se armează și ea în ~10–13 s; portocaliul e citit ca „pot
  // să dictez". Cine aprinde nodul: `refaCmd()`.
  cmd:    {x:.50,y:.31,r:115,on:0,hue:'ice', name:'COMMAND',    tag:'motorul pornește'},
  // COMMS n-are proces propriu care să moară: atârnă de internet, iar lipsa lui
  // se vede în panou, nu pe hartă.
  //
  // `hue` ESTE culoarea aprinsului, nu un detaliu: `on:1` cu `hue:'ice'` desenează
  // nodul în albastrul rece al încăperilor neconstruite, deci arată stins deși
  // e viu. Camerele care fac ceva sunt pe `lamp`. Două comutatoare, nu unul.
  comms:  {x:.20,y:.19,r:62, on:1,hue:'lamp', name:'COMMS',      tag:'mail · doar citire'},
  // Aprins din același motiv ca COMMS: n-are proces propriu care să moară, iar
  // o sursă picată se vede în panou, cu numele ei — nu pe hartă.
  sensors:{x:.80,y:.19,r:62, on:1,hue:'lamp', name:'SENSORS',    tag:'știri · doar citire'},
  eng:    {x:.15,y:.52,r:70, on:1,hue:'lamp', name:'ENGINEERING',tag:'proiecte'},
  recon:  {x:.85,y:.52,r:65, on:0,hue:'ice',  name:'RECON',      tag:'agent · stins'},
  log:    {x:.50,y:.61,r:74, on:1,hue:'lamp', name:"SHIP'S LOG", tag:'fapte, fără voce'},
  // Rândul grecesc: AGORA — AMFITEATRUL — MUNTELE. Distanțele nu sunt egale
  // dinadins. MUNTELE stă mai departe fiindcă e doar al autorului; golul dintre
  // el și AMFITEATRU spune asta fără să scrie nimic.
  //
  // AGORA și MUNTELE sunt pe `lamp`: camere ridicate și folosite, iar pe hartă
  // portocaliul înseamnă „face ceva". `door` (roșul irisului) rămâne la UNA
  // singură, AMFITEATRUL, care nu există încă: „nu intra încă".
  //
  // Rece la construcție, ca COMMAND: și Socrate vorbește prin Open WebUI, deci
  // în fereastra de pornire camera e nefuncțională. Recele spune că MOTORUL ei
  // încă pornește, nu că încăperea lipsește.
  agora:  {x:.19,y:.82,r:55, on:0,hue:'ice', name:'AGORA',      tag:'motorul pornește'},
  amfi:   {x:.50,y:.82,r:48, on:0,hue:'door', name:'AMFITEATRUL',tag:'nu există încă'},
  munte:  {x:.82,y:.82,r:53, on:0,hue:'ice',  name:'MUNTELE',    tag:'motorul pornește'}
};
/* Ordinea capetelor NU e indiferentă: punctul de control al curbei se ia
   perpendicular pe vectorul primul→al doilea, deci scrisă invers, aceeași
   legătură se bombează în partea cealaltă. Perechile oglindite trebuie scrise
   în oglindă: stânga către centru, centrul către dreapta. */
/* Al treilea câmp e conducta: 1 o desenează vie, cu unda care curge prin ea.
   La RECON îl mută `arataAgentul`, fiindcă acolo e un proces care poate muri.
   La COMMS și SENSORS e scris aici, ca și `on` de pe nod: sunt aprinse static,
   iar ce se strică la ele se vede în panou, cu numele sursei.
   NODUL ȘI CONDUCTA SUNT DOUĂ COMUTATOARE, NU UNUL: cine aprinde nodul trebuie
   să aprindă și conducta, altfel nodul viu stă lângă o conductă stinsă. */
const LINKS=[
  ['comms','cmd',1,0],['cmd','sensors',1,1],['eng','cmd',1,2],['cmd','recon',0,3],
  ['log','cmd',1,4],['log','agora',1,5],['munte','log',1,6],['log','amfi',0,7]
];
/* ROȘUL e culoarea stării „ascult" de la irisul dictării. Îl citesc trei locuri:
   minipanourile de perete, camera neconstruită (`door`) și nodul deschis. */
const IRIS='192,86,58';
/* `dead` are aceeași luminanță ca `lamp` (0,4513 față de 0,4511), măsurată:
   mortul se stinge din CULOARE, nu din lumină — stins și din alfa, nodul
   aproape lipsea. NU e gri neutru (ăla ar fi `179,179,179`): păstrează tonul
   albastru, iar saturația de 12% se citește ca gri. */
const COL={lamp:{core:'240,163,66'},ice:{core:'120,165,200'},door:{core:IRIS},dead:{core:'172,180,190'}};

for(const k in NODES){
  const n=NODES[k];
  n.px=0;n.py=0;n.cr=n.r;n.hov=0;n.burst=0;n.strang=0;
  n.parts=[];
  const cnt=Math.round(n.r*2.3);
  for(let i=0;i<cnt;i++){
    n.parts.push({th:Math.random()*Math.PI*2,ph:Math.random()*Math.PI*2,rr:.5+Math.random()*.62,sp:(.15+Math.random()*.5)*(Math.random()<.5?-1:1),sz:.7+Math.random()*1.8,tw:Math.random()*Math.PI*2});
  }
}

const DUST=[];for(let i=0;i<130;i++)DUST.push({x:Math.random(),y:Math.random(),z:.3+Math.random()*.7,s:.4+Math.random()*1.1});

/* window stars — two arched viewports, geometry of the original top arcs */
const WIN=[
  {rx1:.36,ry1:.255,rx2:.47,ry2:.325,tint:'250,185,100',speed:.075,stars:[]},
  // Banda a doua e pe roșul irisului: geamul, dârele și cele două rame se
  // colorează din `tint`.
  {rx1:.22,ry1:.135,rx2:.34,ry2:.23,tint:IRIS,speed:.05,stars:[]}
];
for(const w of WIN){for(let i=0;i<52;i++)w.stars.push({u:Math.random(),f:.10+Math.random()*.80,b:.4+Math.random()*.6,len:.010+Math.random()*.018});}

/* ── Minipanourile de pe pereți ──────────────────────────────────────
   Zece ecrane, cinci pe fiecare perete: UȘILE MANUALULUI — nouă pentru cele
   nouă camere, iar primul, stânga sus, pentru JA.S.Mine întreagă.

   Da, sunt butoane. Regula „fără butoane" e despre controale adăugate ÎN
   panouri; harta e făcută din suprafețe apăsabile. Un minipanou e aceeași
   specie cu un nod: o ușă desenată, nu o comandă.

   Împărțirea pe pereți urmează registrele hărții: la stânga lumea de navă
   (plus manualul, care nu e din niciunul), la dreapta ce a mai rămas din navă
   și tot rândul grecesc.

   ROȘUL e `IRIS`, definit lângă `COL`. Mortul rămâne gri-albastru (`COL.dead`)
   — el nu se apasă. */
const MINI=[];
[['manual','MANUAL'],['cmd','COMMAND'],['comms','COMMS'],['sensors','SENSORS'],['log',"SHIP'S LOG"]]
  .forEach(([k,et],r)=>MINI.push({s:-1,r,k,et}));
[['eng','ENGINEERING'],['recon','RECON'],['agora','AGORA'],['amfi','AMFITEATRUL'],['munte','MUNTELE']]
  .forEach(([k,et],r)=>MINI.push({s:1,r,k,et}));
for(const m of MINI){m.ph=Math.random()*7;m.blink=Math.random()*7;m.hov=0;}

/* Lățimea se DERIVĂ din spațiul liber real: cât rămâne până la nodul lateral
   cel mai apropiat, minus marginea și minus cei ~15px cu care parallax-ul
   plimbă nodurile (`homeXY`). Scrisă fix, ar ieși din ecran pe o fereastră mică
   și ar intra peste noduri pe una joasă și lată. Plafonată sus, ca să nu se
   lățească inutil pe ecran mare. Un singur număr pentru ambii pereți: harta e
   simetrică, iar două lățimi diferite s-ar citi ca o greșeală. */
const MINI_MARJA=14, MINI_PARALLAX=17;
/* Peretele curbat, scris o singură dată. Sunt trei elipse concentrice în
   `drawEnv`, dar numai cea dinăuntru intră pe ecran — celelalte două stau, la
   orice fereastră, în stânga lui x=0. Ea e „linia curbată" pe care minipanourile
   NU au voie s-o depășească. */
const PERETE={dx:.60,rx:.17,ry:.64};
/* Zero, dinadins: panoul nu se OPREȘTE lângă perete, se TERMINĂ în el. Peretele
   e latura lui dinspre hartă — de-aia forma n-are a patra muchie desenată. */
const MINI_PAD_PERETE=0;
/* Cât loc lasă peretele la înălțimea `y`, măsurat din marginea ecranului.
   Aceeași cifră pe amândoi pereții: elipsele sunt oglindite, iar două lățimi
   diferite s-ar citi ca o greșeală. */
function latPerete(y){
  const f=Math.sqrt(Math.max(0,1-Math.pow((y-H*.5)/(PERETE.ry*H),2)));
  return W*(PERETE.rx*f-(PERETE.dx-.5))-MINI_MARJA-MINI_PAD_PERETE;
}
/* Banda pe verticală nu mai e doar ce lasă HUD-urile: e intersecția dintre ele
   și porțiunea de perete care mai lasă loc de un panou citibil. Pe toată
   înălțimea ecranului, arcul se închide spre colțuri — la 1920x1080 rândul de
   sus avea 36px de perete și 120px de panou. Pragul de citit nu e o cifră
   inventată: e minimul dintre 56px și 80% din ce oferă peretele la mijloc,
   ca pe fereastră mică să se strângă în loc să iasă afară. */
function bandaMini(){
  let sus=BANDA.sus, jos=BANDA.jos||(H-52);
  const latMax=latPerete(H*.5);
  const f=(Math.min(56,latMax*.8)+MINI_MARJA+MINI_PAD_PERETE)/W/PERETE.rx+(PERETE.dx-.5)/PERETE.rx;
  if(f<1){
    const dy=PERETE.ry*H*Math.sqrt(1-f*f);
    sus=Math.max(sus,H*.5-dy);jos=Math.min(jos,H*.5+dy);
  }
  return {sus,jos};
}
function latMini(){
  const s=scaraNod();
  let lib=W;
  for(const k in NODES){
    const n=NODES[k];
    const d=n.x<.5?n.x*W-n.r*s:W-(n.x*W+n.r*s);
    if(d<lib)lib=d;
  }
  return Math.max(52,Math.min(120,lib-MINI_MARJA-MINI_PARALLAX));
}
/* Un singur loc care spune unde stă un minipanou — desenul, mouse-ul și clicul
   citesc de aici. Scrisă de două ori, geometria s-ar despărți la prima
   ajustare, iar zona apăsabilă ar rămâne lângă dreptunghi, nu pe el. */
/* Banda pe verticală NU se ghicește: se măsoară cele două HUD-uri, care sunt
   HTML peste canvas. Cu numere fixe, minipanourile ar cădea peste stardate și
   peste `×`, singurul buton de pe hartă.
   Se recalculează la redimensionare, nu la fiecare cadru: HUD-ul de sus își
   schimbă înălțimea doar când se schimbă fereastra. */
let BANDA={sus:72,jos:0};
function masoaraBanda(){
  const sus=document.querySelector('.hud-top'), jos=document.querySelector('.hud-bot');
  BANDA={
    sus:(sus?sus.getBoundingClientRect().bottom:64)+14,
    jos:H-(jos?jos.getBoundingClientRect().height:40)-14
  };
}
addEventListener('resize',masoaraBanda);
masoaraBanda();
// Fontul condensat ajunge mai târziu și schimbă înălțimea HUD-ului. Fără
// remăsurare, banda ar rămâne calculată pe fontul de rezervă.
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(masoaraBanda);
function geomMini(m){
  const wMax=latMini();
  const {sus,jos}=bandaMini();
  // Înălțimea se ia din lățimea CEA MAI MARE, nu din a fiecăruia: rândurile
  // rămân egale pe verticală și aliniate, se schimbă doar lățimea.
  let h=Math.max(36,wMax*.52);
  // Fereastră scundă: mai bine cinci minipanouri turtite decât cinci care ies
  // din ecran. Sub 26px nu mai încape nici numele, deci acolo se oprește.
  if(sus+5*h+4*8>jos)h=Math.max(26,(jos-sus-32)/5);
  const pas=Math.max(h+4,(jos-sus-h)/4);
  const y=sus+m.r*pas;
  /* Aici devin INEGALE, dinadins — și nu doar între ele: un panou nu mai are
     nici măcar lățime CONSTANTĂ. `marg` spune, la orice înălțime, cât e de la
     marginea ecranului până la perete; nodurile pun un plafon peste, ca panoul
     să nu se lățească peste hartă acolo unde arcul se bombează. */
  const marg=yy=>Math.max(8,Math.min(wMax,latPerete(yy)));
  const a=marg(y), b=marg(y+h);
  /* Două lățimi, pentru două treburi. `wCont` e cât e sigur pe TOATĂ înălțimea
     — acolo încape scrisul, ca să nu iasă un „L" din formă. `wBox` e cutia care
     cuprinde forma, pentru desen. */
  const wCont=Math.min(a,b), wBox=Math.max(a,b);
  return {y,h,s:m.s,marg,wCont,wBox,
    x :m.s<0?MINI_MARJA:W-MINI_MARJA-wBox,
    xc:m.s<0?MINI_MARJA:W-MINI_MARJA-wCont};
}
/* Muchia dinspre hartă, la înălțimea `yy` — chiar peretele. */
function xPerete(g,yy){return g.s<0?MINI_MARJA+g.marg(yy):W-MINI_MARJA-g.marg(yy);}

/* `selected` e NODUL selectat — el se mută în mijlocul hărții cât e panoul lui
   deschis. `manualDeschis` e altceva: un manual folosește aceeași fereastră, dar
   n-are voie să tragă niciun nod din loc. De-aia sunt două variabile și o
   întrebare comună, `deschis()`, pentru tot ce ține de „e ceva pe ecran". */
let selected=null,manualDeschis=null,mx=.5,my=.5,t=0,hover=null,hoverMini=null;
const deschis=()=>selected||manualDeschis;
function homeXY(n){const p=RM?0:1;return [n.x*W+(mx-.5)*30*p,n.y*H+(my-.5)*22*p];}
addEventListener('mousemove',e=>{mx=e.clientX/W;my=e.clientY/H;},{passive:true});

function drawWindows(){
  const cxm=W/2, cy=-.16*H;
  for(const w of WIN){
    const rxm=(w.rx1+w.rx2)/2, rym=(w.ry1+w.ry2)/2;
    /* glass: thick soft arc between the two frames */
    cx.beginPath();
    cx.ellipse(cxm,cy,rxm*W,rym*H,0,Math.PI*.08,Math.PI*.92);
    cx.strokeStyle='rgba('+w.tint+',.08)';
    cx.lineWidth=(w.ry2-w.ry1)*H;
    cx.stroke();
    /* streaking stars, computed directly on the band */
    for(const st of w.stars){
      if(!RM)st.u=(st.u+w.speed*(0.5+st.f)*0.016)%1;
      const ang=Math.PI*.08+st.u*Math.PI*.84;
      const rx=(w.rx1+(w.rx2-w.rx1)*st.f)*W;
      const ry=(w.ry1+(w.ry2-w.ry1)*st.f)*H;
      const x1=cxm+Math.cos(ang)*rx, y1=cy+Math.sin(ang)*ry;
      const ang2=ang-st.len*8;
      const x2=cxm+Math.cos(ang2)*rx, y2=cy+Math.sin(ang2)*ry;
      if(y1<-6&&y2<-6)continue;
      cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);
      cx.strokeStyle='rgba('+w.tint+','+(0.45+st.b*.55)+')';
      cx.lineWidth=1.1+st.b*1.1;
      cx.stroke();
    }
    /* window frames */
    for(const [rx,ry] of [[w.rx1,w.ry1],[w.rx2,w.ry2]]){
      cx.beginPath();
      cx.ellipse(cxm,cy,rx*W,ry*H,0,Math.PI*.06,Math.PI*.94);
      cx.strokeStyle='rgba('+w.tint+',.5)';
      cx.lineWidth=1.6;cx.stroke();
    }
  }
}

function drawEnv(){
  const cxm=W/2;
  for(const d of DUST){
    const dx=d.x*W+(mx-.5)*60*d.z*(RM?0:1), dy=d.y*H+(my-.5)*44*d.z*(RM?0:1);
    cx.beginPath();cx.arc(dx,dy,d.s*d.z,0,7);
    cx.fillStyle='rgba(159,212,245,'+(0.05+d.z*.06)+')';cx.fill();
  }
  drawWindows();
  /* wall arcs */
  for(const s of [-1,1]){
    for(let i=0;i<3;i++){
      cx.beginPath();
      // Arcul dinăuntru (i=0) își ia cifrele din PERETE: el e și marginea după
      // care se taie minipanourile. Scris de două ori, s-ar despărți la prima
      // ajustare, iar panourile ar ieși din perete fără ca nimic să se schimbe
      // vizibil în cod.
      const ax=cxm+s*(PERETE.dx+i*.13)*W;
      cx.ellipse(ax,H*.5,(PERETE.rx+i*.05)*W,(PERETE.ry+i*.08)*H,0,0,Math.PI*2);
      cx.strokeStyle='rgba(240,163,66,'+(0.18-i*.05)+')';
      cx.lineWidth=1.8-i*.4;cx.stroke();
    }
  }
  /* Minipanourile — ușile manualului.
     Nu mai sunt dreptunghiuri: au trei muchii drepte, iar a patra — cea dinspre
     hartă — E PERETELE. Nu se desenează deloc, fiindcă arcul trece deja exact
     pe acolo; un chenar peste el ar fi a doua linie pe același drum. De-aia
     forma se umple pe o cale care urmează curba, nu pe `fillRect`. */
  for(const m of MINI){
    const g=geomMini(m), yy=g.y, bh=g.h;
    const xin=g.s<0?MINI_MARJA:W-MINI_MARJA;   // muchia dinspre marginea ecranului
    const a=m.hov;                       // 0 rece, 1 sub deget
    const desc=manualDeschis===m.k?1:0;  // panoul lui e deschis chiar acum
    const cald=Math.max(a,desc);
    /* Rece și cald sunt aceeași culoare, deosebite prin intensitate — pe punte
       nu mai e nimic argintiu. Semnalul de sub deget stătea oricum în chenar și
       în umplere, nu în nuanța numelui: chenarul sare de la .38 la .95, numele
       de la .80 la 1. */
    const pasC=Math.max(2,bh/14);
    cx.beginPath();cx.moveTo(xin,yy);cx.lineTo(xPerete(g,yy),yy);
    for(let q=yy+pasC;q<yy+bh;q+=pasC)cx.lineTo(xPerete(g,q),q);
    cx.lineTo(xPerete(g,yy+bh),yy+bh);cx.lineTo(xin,yy+bh);cx.closePath();
    cx.fillStyle='rgba('+IRIS+','+(.05+cald*.07)+')';cx.fill();
    // Numai cele trei muchii drepte, ca linie deschisă: sus, marginea, jos.
    cx.beginPath();cx.moveTo(xPerete(g,yy),yy);cx.lineTo(xin,yy);
    cx.lineTo(xin,yy+bh);cx.lineTo(xPerete(g,yy+bh),yy+bh);
    cx.strokeStyle='rgba('+IRIS+','+(.38+cald*.57)+')';
    cx.lineWidth=1;cx.stroke();
    /* Scrisul stă în `wCont`, lățimea sigură pe toată înălțimea: măsurat pe
       partea largă, un nume ar ieși din formă exact acolo unde curba se strânge.
       Numele camerei, apoi cuvântul care spune ce se deschide — fără al doilea
       rând, zece forme identice nu spun nimic, și tocmai el e motivul pentru
       care nu trebuie ghicit că sunt apăsabile. */
    const bw=g.wCont, x0=g.xc;
    let fs=Math.max(8,Math.min(11,bw*.105));
    cx.textAlign='left';
    do{cx.font='600 '+fs.toFixed(1)+'px "Saira Condensed"';fs-=.5;}
    while(fs>7&&cx.measureText(m.et).width>bw-14);
    cx.fillStyle='rgba('+IRIS+','+(.80+cald*.20)+')';
    cx.fillText(m.et,x0+7,yy+13);
    if(bh>=40){
      cx.font='8px "IBM Plex Mono"';
      cx.fillStyle='rgba('+IRIS+','+(.52+cald*.33)+')';
      cx.fillText('manual',x0+7,yy+24);
    }
    /* Barele nu măsoară nimic și n-au voie să pretindă că măsoară: n-au
       etichetă, n-au cifră, n-au capăt. Spun un singur lucru — peretele e
       viu — și ăsta e adevărat. */
    const nb=bh>=52?2:1;
    for(let l=0;l<nb;l++){
      const wv=RM?.7:(.45+.5*Math.abs(Math.sin(t*.6+m.ph+l*1.3)));
      cx.fillStyle='rgba('+IRIS+','+(0.3+((m.r+l)%2)*.1)+')';
      cx.fillRect(x0+7,yy+bh-13-l*7,(bw-16)*wv,2.2);
    }
    /* Indicatorul care clipește — roșul irisului, cel de la „ascult". Stă în
       colțul din DREAPTA SUS al formei, ca înainte: la panourile din stânga ăla
       e peretele, la cele din dreapta marginea ecranului. Pus pe perete la
       amândouă, la cele din dreapta ar fi căzut peste prima literă a numelui. */
    const bl=RM?1:(Math.sin(t*2.2+m.blink)>.3?1:0);
    cx.beginPath();cx.arc(g.s<0?xPerete(g,yy+8)-8:xin-8,yy+8,2.4,0,7);
    cx.fillStyle='rgba('+IRIS+','+(bl?1:.22)+')';cx.fill();
    /* Linia de scanare, singura mișcare pe toată înălțimea. Se întinde până în
       perete, deci se lungește și se scurtează odată cu forma. */
    const sv=RM?.5:((t*.25+m.ph)%1), sy=yy+2+(bh-6)*sv;
    const wsc=Math.max(0,g.marg(sy)-4);
    cx.fillStyle='rgba('+IRIS+',.24)';
    cx.fillRect(g.s<0?xin+2:xin-2-wsc,sy,wsc,1.4);
  }
  /* floor rings */
  for(let i=0;i<3;i++){
    cx.beginPath();
    cx.ellipse(cxm,H*1.07,(.26+i*.19)*W,(.13+i*.075)*H,0,Math.PI,Math.PI*2);
    cx.strokeStyle='rgba(240,163,66,'+(0.22-i*.06)+')';
    cx.lineWidth=1.8;cx.stroke();
  }
}

function drawLinks(){
  for(const [a,b,live,ph] of LINKS){
    const A=NODES[a],B=NODES[b];
    const x1=A.px,y1=A.py,x2=B.px,y2=B.py;
    const mxq=(x1+x2)/2+(y1-y2)*.13, myq=(y1+y2)/2+(x2-x1)*.13;
    const path=()=>{cx.beginPath();cx.moveTo(x1,y1);cx.quadraticCurveTo(mxq,myq,x2,y2);};
    if(live){
      /* tube walls */
      path();cx.strokeStyle='rgba(240,163,66,.07)';cx.lineWidth=11;cx.stroke();
      path();cx.strokeStyle='rgba(240,163,66,.16)';cx.lineWidth=4.5;cx.stroke();
      path();cx.strokeStyle='rgba(240,163,66,.42)';cx.lineWidth=1.4;cx.stroke();
      /* energy wave flowing through the tube */
      if(!RM){
        for(let wv=0;wv<2;wv++){
          const u=((t*.16)+ph*.17+wv*.5)%1;
          const g=cx.createLinearGradient(x1,y1,x2,y2);
          const lo=Math.max(0,u-.16), hi=Math.min(1,u+.16);
          g.addColorStop(0,'rgba(240,163,66,0)');
          if(lo>0)g.addColorStop(lo,'rgba(240,163,66,0)');
          g.addColorStop(u,'rgba(255,205,120,.95)');
          if(hi<1)g.addColorStop(hi,'rgba(240,163,66,0)');
          g.addColorStop(1,'rgba(240,163,66,0)');
          path();cx.strokeStyle=g;cx.lineWidth=5.5;cx.stroke();
          /* comet head */
          const px=(1-u)*(1-u)*x1+2*(1-u)*u*mxq+u*u*x2;
          const py=(1-u)*(1-u)*y1+2*(1-u)*u*myq+u*u*y2;
          cx.beginPath();cx.arc(px,py,3,0,7);
          cx.fillStyle='rgba(255,215,140,1)';cx.fill();
          cx.beginPath();cx.arc(px,py,7,0,7);
          cx.fillStyle='rgba(240,163,66,.25)';cx.fill();
        }
      }
    }else{
      path();cx.strokeStyle='rgba(94,126,150,.38)';cx.lineWidth=1.1;
      cx.setLineDash([5,7]);cx.stroke();cx.setLineDash([]);
    }
  }
}

function drawNode(k){
  const n=NODES[k];
  /* Nodul DESCHIS trece pe roșul irisului, cât e panoul lui pe ecran — culoare,
     nu doar mărime. Mărimea spune „ăsta e"; culoarea spune „ăsta lucrează
     ACUM". Se pune peste `hue`, nu în locul lui: `on` și `hue` rămân starea
     camerei, iar asta e o stare de moment, care se ia înapoi la închidere. */
  const desch=selected===k;
  /* Stinsul are DOUĂ înțelesuri: „există și e închis" (RECON stins, COMMAND,
     AGORA și MUNTELE la pornire rece) și „nu există încă" (AMFITEATRUL). Primul e
     gri, al doilea e `COL.door`, desenat chiar dacă `on` e 0 — altfel griul ar
     spune „există" despre o cameră care nu există. */
  const col=desch?{core:IRIS}:(n.on||n.hue==='door'?COL[n.hue]:COL.dead);
  /* Mortul nu se stinge și din alfa: intensitatea o poartă CULOAREA, nu
     transparența — altfel s-ar stinge de două ori și ar „lipsi aproape".
     Singura excepție e haloul de mai jos: el e ce RADIAZĂ, iar portocaliul
     înseamnă „face ceva". Rămâne mai jos la mort, ca să nu strige mai tare
     decât viul. */
  const R=n.cr*(1+n.hov*.06);
  const gg=cx.createRadialGradient(n.px,n.py,R*.2,n.px,n.py,R*1.9);
  gg.addColorStop(0,'rgba('+col.core+','+((n.on?.20:.10)+n.hov*.08)+')');
  gg.addColorStop(1,'transparent');
  cx.fillStyle=gg;cx.beginPath();cx.arc(n.px,n.py,R*1.9,0,7);cx.fill();
  // Cât se numără tăcerea, elipsele se strâng spre centru. E singurul lucru
  // care arată timpul care trece fără să scrie o cifră pe ecran.
  const sg=1-(n.strang||0)*.28;
  cx.beginPath();cx.ellipse(n.px,n.py,R*1.18*sg,R*.44*sg,t*.1*(RM?0:1),0,7);
  cx.strokeStyle='rgba('+col.core+',.3)';cx.lineWidth=.9;cx.stroke();
  cx.beginPath();cx.ellipse(n.px,n.py,R*.9*sg,R*1.12*sg,-t*.07*(RM?0:1)+.9,0,7);
  cx.strokeStyle='rgba('+col.core+',.18)';cx.lineWidth=.7;cx.stroke();
  const spin=RM?0:t;
  for(const p of n.parts){
    const th=p.th+spin*p.sp;
    const sx=Math.cos(th)*Math.sin(p.ph), sy=Math.cos(p.ph)*.74, sz=Math.sin(th)*Math.sin(p.ph);
    const depth=(sz+1)/2, rr=R*p.rr*(1+n.burst*.55);
    const x=n.px+sx*rr, y=n.py+sy*rr;
    const tw=RM?1:(.6+.4*Math.sin(t*2+p.tw));
    cx.beginPath();cx.arc(x,y,p.sz*(.5+depth*.9),0,7);
    cx.fillStyle='rgba('+col.core+','+((0.14+depth*.55)*tw)+')';cx.fill();
  }
  cx.beginPath();cx.arc(n.px,n.py,Math.max(3,R*.08),0,7);
  cx.fillStyle='rgba('+col.core+',.95)';cx.fill();
  const ly=n.py+R*1.28+16;
  cx.font='600 13px "Saira Condensed"';cx.textAlign='center';
  // Numele și eticheta merg cu orbul: altfel nodul deschis s-ar citi ca două
  // obiecte suprapuse, un orb roșu sub un nume albastru.
  cx.fillStyle=desch?'rgba('+IRIS+',1)':(n.on?'rgba('+IRIS+','+(0.78+n.hov*.22)+')':'rgba('+col.core+',.8)');
  cx.fillText(n.name.split('').join(' '),n.px,ly);
  cx.font='10.5px "IBM Plex Mono"';
  cx.fillStyle=desch?'rgba('+IRIS+',.78)':(n.on?'rgba(240,163,66,.75)':'rgba('+col.core+',.75)');
  cx.fillText(n.tag,n.px,ly+16);
}

function frame(){
  t+=RM?0:.016;
  // Partea VĂZUTĂ a urechii. Particulele respiră cu vocea, elipsele se strâng
  // pe măsură ce tăcerea se apropie de prag — dacă pragul de volum e greșit
  // reglat, se vede pe loc.
  //
  // Cifrele vin de pe firul audio (U.nivel, U.strang), nu se calculează aici:
  // rAF se oprește cu fereastra ascunsă, dar tot e ceva de auzit. Desenul poate
  // să moară; urechea nu.
  // Doar în ENGAGE. În AȘTEPT harta ar pulsa toată ziua, la fiecare vorbă spusă
  // în cameră — un semn care nu mai spune nimic fiindcă e mereu acolo.
  if(U.mod==='engage'&&!RM){
    NODES.cmd.burst=Math.min(1,U.nivel*7);
    NODES.cmd.strang=U.strang;
  }
  // Minipanourile se încălzesc și se răcesc lin, ca nodurile. Cât e ceva
  // deschis nu se aprinde niciunul: acolo mouse-ul lucrează pentru fereastră.
  for(const m of MINI)m.hov+=((hoverMini===m&&!deschis()?1:0)-m.hov)*.15;
  cx.clearRect(0,0,W,H);
  drawEnv();
  for(const k in NODES){
    const n=NODES[k];
    const [hx,hy]=homeXY(n);
    const s=scaraNod();
    let tx=hx,ty=hy,tr=n.r*s;
    // Panoul mare se întinde până pe la jumătatea ecranului, deci nodul lui se
    // dă mai la dreapta ca să nu ajungă sub fereastră. Sub prag, fereastra e
    // îngustă din nou și nodul stă unde a stat dintotdeauna.
    if(selected===k){tx=W*(P[k]&&P[k].mare&&larg()?.82:.66);ty=H*.46;tr=n.r*2.1*s;}
    else if(selected){tx=hx+(hx-W/2)*.05;ty=hy+(hy-H/2)*.05;tr=n.r*.9*s;}
    n.px+=(tx-(n.px||tx))*.08;n.py+=(ty-(n.py||ty))*.08;
    if(!n._i){n.px=tx;n.py=ty;n._i=1;}
    n.cr+=(tr-n.cr)*.08;
    n.hov+=((hover===k&&!deschis()?1:0)-n.hov)*.15;
    n.burst*=.9;
  }
  // Harta se estompează sub ORICE fereastră deschisă, inclusiv sub un manual:
  // ce se citește e în față, restul e fundal.
  cx.globalAlpha=deschis()?0.45:1;
  drawLinks();
  for(const k in NODES){
    if(k===selected)continue;
    cx.globalAlpha=deschis()?0.35:1;
    drawNode(k);
  }
  cx.globalAlpha=1;
  if(selected)drawNode(selected);
  requestAnimationFrame(frame);
}

/* ── Rularea RECON supraviețuiește panoului ──────────────────────────
   Panoul se reconstruiește la fiecare deschidere, deci orice stare ținută
   în `wire()` moare la primul Escape. Iar Escape e exact ce apeși când o
   rulare pare că nu face nimic: rămâi fără nicio urmă că agentul lucrează.

   De-asta starea stă AICI, afară: cronometrul se regăsește la redeschidere,
   iar rezultatul te așteaptă dacă rularea s-a terminat cât erai plecat. */
const RECON_STARE={pornit:null,rezultat:null,tic:null,pandar:null};
const RECON_SECUNDE=()=>Math.round((Date.now()-RECON_STARE.pornit)/1000);

const P={
  cmd:{n:'COMMAND',s:'Aici ceri fapte. Se duce după ele.',
       ...faChat('sky')},
  eng:{n:'ENGINEERING',s:'Stare, nu evaluare',html(){
    return '<div id="eng-out"><div class="empty">Citesc lista…</div></div>'
      +'<div class="hint">Depozit: date\\proiecte.json — se vede la reîncărcare.</div>';},
    wire(){
      const out=document.getElementById('eng-out');
      fetch('/api/proiecte').then(r=>r.json()).then(d=>{
        if(!d||!d.ok){
          // Fișierul e scris de mână, deci motivul contează: „linia 7, coloana 3"
          // e reparabil, „nu s-a putut" nu e.
          out.innerHTML='<div class="need">Lista nu s-a putut citi.<br><em>'
            +esc((d&&d.eroare)||'necunoscut')+'</em></div>';return;}
        const l=d.proiecte||[];
        // esc() de-acum: textul vine dintr-un fișier de pe disc, nu din pagină.
        out.innerHTML=l.length
          ?l.map(p=>'<div class="row"><span>'+esc(p.n||'')+' — '+esc(p.s||'')
            +'</span><span class="v">'+esc(p.u||'')+'</span></div>').join('')
          :'<div class="empty">Fișierul e gol.</div>';
      }).catch(()=>{out.innerHTML='<div class="need">Serverul JA.S.Mine nu răspunde.</div>';});
    }},
  log:{n:"SHIP'S LOG",s:'Consemnează un fapt. Fără comentariu.',html(){return '<div class="fld"><input id="i-log" placeholder="Ce s-a întâmplat." autocomplete="off"><button class="btn" id="b-log">Consemnează</button></div><div id="l-list"></div><div class="hint" id="h-log">Depozit: date\\jurnal.jsonl. Ideea depășită se scoate cu × — nu dispare, se mută în jurnal-inchis.jsonl.</div>';},
    wire(){
      const i=document.getElementById('i-log'),L=document.getElementById('l-list'),h=document.getElementById('h-log');
      const HINT=h.textContent;
      /* Indicele din `jurnal`, nu un id: jurnalul n-are id-uri pe disc, iar
         rândul se identifică la server prin `cand` + `text`. Aici e nevoie doar
         să știm pe care l-a apăsat omul. */
      const dr=()=>{L.innerHTML=jurnal.length?jurnal.map((e,ix)=>'<div class="row log-r" data-i="'+ix+'"><div class="log-cap"><span class="v w">'+stamp(new Date(e.cand))+'</span><button class="conv-x" title="Scoate ideea din jurnal">×</button></div><div class="log-t">'+esc(e.text)+'</div></div>').join(''):'<div class="empty">Jurnal gol.</div>';};
      const err=()=>{h.textContent='Serverul nu răspunde. Intrarea NU s-a salvat.';};
      /* Scoaterea unei idei depășite. FĂRĂ confirmare: rândul nu se aruncă, se
         mută în `jurnal-inchis.jsonl`. O întrebare pusă pentru un gest care nu
         pierde nimic e o treaptă în plus la fiecare curățenie.
         Lista nu se recere de la server: răspunsul spune deja că rândul a plecat. */
      const scoate=it=>{
        fetch('/api/jurnal',{method:'DELETE',headers:{'Content-Type':'application/json'},
                             body:JSON.stringify({cand:it.cand,text:it.text})})
          .then(r=>r.json())
          .then(d=>{
            if(!d||!d.ok){h.textContent=(d&&d.eroare)||'Nu s-a putut scoate.';return;}
            const k=jurnal.indexOf(it);if(k>=0)jurnal.splice(k,1);
            h.textContent=HINT;dr();})
          .catch(()=>{h.textContent='Serverul nu răspunde. NU s-a scos nimic.';});};
      /* Un click, o delegare — rândurile se redesenează la fiecare schimbare. */
      L.onclick=e=>{
        if(!e.target.closest('.conv-x'))return;
        const rand=e.target.closest('.log-r');if(!rand)return;
        const it=jurnal[+rand.dataset.i];if(it)scoate(it);};
      fetch('/api/jurnal').then(r=>r.json()).then(d=>{jurnal.length=0;jurnal.push(...d);dr();}).catch(err);
      const ad=()=>{const v=i.value.trim();if(!v)return;
        fetch('/api/jurnal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:v})})
          .then(r=>{if(!r.ok)throw 0;return r.json();})
          .then(e=>{jurnal.unshift(e);i.value='';dr();})
          .catch(err);};
      document.getElementById('b-log').onclick=ad;
      i.addEventListener('keydown',e=>{if(e.key==='Enter')ad()});dr();i.focus();
    }},
  /* COMMS n-are butoane, spre deosebire de RECON, unde „Rulează" costă bani.
     Aici raportul e gratuit și nu atinge Gmail-ul, deci se citește singur la
     deschiderea panoului.
     Deschiderea MUTĂ reperul, la fel ca ușa din chat: un singur mecanism. Nu e o
     pierdere — raportul e chiar pe ecran în clipa aia, iar `date\comms.jsonl` îl
     păstrează. De-asta scrie în hint pe unde se privește înapoi. */
  comms:{n:'COMMS',s:'Mail · doar citire',html(){
    return '<div id="comms-out"><div class="empty">Citesc inboxul…</div></div>'
      +'<div class="hint">Ce a intrat necitit de la ultimul raport. Odată afișat, fereastra se închide — data viitoare vezi doar ce a apărut între timp. Nimic nu se marchează citit în Gmail. Ca să te uiți înapoi, cere-i lui Sky „ce mailuri am avut în ultimele trei zile”: aia nu mișcă reperul.</div>';},
    wire(){
      const out=document.getElementById('comms-out');
      const err=m=>{out.innerHTML='<div class="need">'+m+'</div>';};
      fetch('/api/comms/raport').then(r=>r.json()).then(d=>{
        /* Titlul erorii vine de la SERVER, ca la RECON: `server` spune Gmail sau
           JA.S.Mine, ca eșecul să se repare în locul potrivit. */
        if(!d||!d.ok){err(esc((d&&d.eroare)||'Nu pot citi mailul.')
          +((d&&d.detaliu)?'<br><em>'+esc(d.detaliu)+'</em>':''));return;}
        const r=(d.date&&d.date.raport)||{},txt=(d.date&&d.date.text)||'';
        let html='<div class="need" style="margin-bottom:12px">'+esc(txt).replace(/\n/g,'<br>')+'</div>';
        const lst=r.mailuri||[];
        /* Panoul arată expeditorul și subiectul, atât. Propoziția de rezumat o
           scrie Sky, în chat — aici n-are cine s-o scrie, și un extras brut de
           400 de caractere pe ecran ar fi zgomot, nu informație. */
        html+=lst.length?lst.map(m=>{
          const d2=new Date(m.data),ceas=isNaN(d2)?'':stamp(d2);
          return '<div class="row"><span>'+esc(m.eticheta)+' — '+esc(m.subiect||'(fără subiect)')
            +'</span><span class="v w">'+ceas+'</span></div>';}).join('')
          :'<div class="empty">Nimic nou.</div>';
        out.innerHTML=html;
      }).catch(()=>err('Serverul JA.S.Mine nu răspunde.'));
    }},
  /* SENSORS, ca și COMMS, n-are butoane: citirea e gratuită și nu schimbă nimic
     nicăieri, deci se face singură la deschidere.
     Spre deosebire de COMMS, deschiderea NU consumă nimic. Acolo, reperul se
     mută fiindcă panoul ARATĂ raportul. Aici „dat deja" înseamnă „spus de Sky",
     iar panoul nu spune, doar arată — și arată tot, inclusiv ce a spus el, doar
     că stins. Așa panoul e și supapa: locul unde te uiți înapoi la fereastra
     întreagă fără să ceri nimic nimănui, și fără să plătești un token. */
  sensors:{n:'SENSORS',s:'Știri · doar citire',html(){
    return '<div id="sens-out"><div class="empty">Citesc fluxurile…</div></div>'
      +'<div class="hint">Ce a apărut în ultimele 24 de ore la Digi24, Economedia și CNN, economicele deasupra. Stins = ți-a spus deja Sky. Titlul e link: se deschide în altă fereastră.</div>';},
    wire(){
      const out=document.getElementById('sens-out');
      const err=m=>{out.innerHTML='<div class="need">'+m+'</div>';};
      fetch('/api/sensors/raport').then(r=>r.json()).then(d=>{
        /* Titlul erorii vine de la SERVER, ca la COMMS și RECON: `server` spune
           pe cine repari — site-urile sau JA.S.Mine. */
        if(!d||!d.ok){err(esc((d&&d.eroare)||'Nu pot citi știrile.')
          +((d&&d.detaliu)?'<br><em>'+esc(d.detaliu)+'</em>':''));return;}
        const r=(d.date&&d.date.raport)||{},lst=r.stiri||[];
        if(!lst.length){err(esc((d.date&&d.date.text)||'Nicio știre.'));return;}
        const rand=s=>{
          const t=new Date(s.data),ceas=isNaN(t)?'':stamp(t);
          return '<div class="stire'+(s.spusa?' spusa':'')+'">'
            +linkSigur(s.link,esc(s.titlu))
            +'<div class="m">'+esc(s.sursa)+' · '+ceas+(s.spusa?' · spusă':'')+'</div></div>';};
        const ec=lst.filter(s=>s.categorie==='economie'),alte=lst.filter(s=>s.categorie!=='economie');
        let html='';
        if(ec.length)html+='<div class="grup sus">Economie</div>'+ec.map(rand).join('');
        if(alte.length)html+='<div class="grup'+(ec.length?'':' sus')+'">Restul</div>'+alte.map(rand).join('');
        html+='<div class="hint" style="margin-top:14px">'+esc((d.date&&d.date.text)||'')+'</div>';
        out.innerHTML=html;
      }).catch(()=>err('Serverul JA.S.Mine nu răspunde.'));
    }},
  recon:{n:'RECON',s:'Agent 051 · fapte, fără voce',html(){
    return '<div class="fld">'
      +'<button class="btn" id="b-recon-st" style="flex:1;padding:9px 0">Stare pipeline</button>'
      +'<button class="btn" id="b-recon-br" style="flex:1;padding:9px 0">Briefing</button>'
      +'</div>'
      +'<div class="fld" style="margin-top:8px">'
      +'<button class="btn" id="b-recon-run" style="flex:1;padding:9px 0;border-color:var(--gold);color:var(--gold)">Rulează + briefing</button>'
      +'</div>'
      +'<div id="recon-out"><div class="empty">Interoghez agentul…</div></div>'
      +'<div class="hint">„Briefing" arată joburile, oricând, fără să miște nimic. „Rulează + briefing" caută mailuri noi și le procesează. Fiecare rulare pornește de unde ai rămas: <b>sus e ce a adus ultima rulare</b>, dedesubt toate joburile.</div>';},
    wire(){
      const out=document.getElementById('recon-out');
      const bSt=document.getElementById('b-recon-st'),bBr=document.getElementById('b-recon-br'),bRun=document.getElementById('b-recon-run');
      const busy=m=>{out.innerHTML='<div class="empty">'+m+'</div>';};
      const err=m=>{out.innerHTML='<div class="need">'+m+'</div>';};
      const row=(k,v,w)=>'<div class="row"><span>'+k+'</span><span class="v'+(w?' w':'')+'">'+v+'</span></div>';
      /* Butoanele se caută în DOM la fiecare apel, nu se țin de referințele
         de mai sus: o rulare pornită într-un panou se poate termina într-altul,
         după ce Escape l-a închis pe primul. Cu referințe capturate, `lock(false)`
         de la sfârșit ar debloca butoane care nu mai există, iar cele de pe ecran
         ar rămâne stinse pentru totdeauna. */
      const lock=v=>{['b-recon-st','b-recon-br','b-recon-run'].forEach(id=>{
        const b=document.getElementById(id);if(!b)return;
        b.disabled=v;b.style.opacity=v?'.45':'';b.style.pointerEvents=v?'none':'';});};
      /* Titlul erorii vine de la SERVER, nu e scris aici: fiecare eșec își
         numește serverul („agentul 051 nu raspunde", „serverul JA.S.Mine nu a
         putut executa unealta"), iar `detaliu` poartă cauza desfăcută din grupul
         de excepții. Scris fix aici, titlul ar acuza agentul și pentru un defect
         al serverului JA.S.Mine. */
      const esec=d=>{if(d&&d.ok)return false;
        err(esc((d&&d.eroare)||'Agentul 051 nu răspunde.')
          +((d&&d.detaliu)?'<br><em>'+esc(d.detaliu)+'</em>':''));return true;};
      const jobul=o=>'<div class="row" style="display:block;padding:9px 0">'
        +'<div><span>'+esc(o.titlu||'')+'</span> — <span class="v">'+esc(o.firma||'')+'</span>'
        +(o.link?' · '+linkSigur(o.link,'link','color:var(--ice)'):'')+'</div>'
        +(o.motiv?'<div class="hint" style="margin-top:4px">'+esc(o.motiv)+'</div>':'')
        +'</div>';
      /* LISTA ÎNTREAGĂ, sub delta, cu titlul ei, și nu dispare niciodată: cu
         numai delta de la reper, o bază plină de candidate ar arăta „Nimic de
         semnalat". Delta stă sus fiindcă după o rulare întrebarea e „ce a adus". */
      const htmlJoburi=d=>{
        const lst=(d.date&&d.date.oportunitati)||[],tot=(d.date&&d.date.total_candidate);
        const cap='<div class="grup" style="margin-top:18px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)">Toate joburile</div>';
        if(!lst.length)return cap+'<div class="empty">Baza agentului e goală — nimic evaluat încă.</div>';
        return cap+'<div class="hint" style="margin-bottom:10px">'+lst.length+' din '+tot
          +' candidate, în ordinea priorității.</div>'+lst.map(jobul).join('');};
      /* „Nimic nou" trebuie să se vadă ca RĂSPUNS, nu ca tăcere: altfel o
         unealtă care lucrează corect arată la fel ca una moartă. Ceasul e în ora
         ta, nu în UTC-ul din textul agentului. */
      const htmlDelta=d=>{
        if(!d||!d.ok)return '';
        const b=(d.date&&d.date.briefing)||{};
        let h='<div class="grup sus">Ce a adus ultima rulare</div><div class="hint">'
          +'Rularea din '+(b.de_la?stamp(new Date(b.de_la)):'—')+': '
          +(b.mesaje_noi||0)+' mesaje, '+(b.anunturi_noi||0)+' anunțuri noi';
        const lst=b.merita_atentie||[];
        h+=lst.length?', dintre care '+lst.length+' de semnalat:</div>'+lst.map(jobul).join('')
                     :'. Nimic nou de semnalat.</div>';
        /* „Nimic de semnalat" spus înainte ca agentul să fi judecat tot e o
           minciună prin omisiune — arată identic cu „am judecat tot și n-a ieșit
           nimic". `in_asteptare` se uită la TOATĂ baza, nu doar la noutăți: o
           coadă rămasă de săptămâna trecută face briefingul de azi la fel de
           incomplet ca una de acum zece minute.

           Rândul apare numai când `total` e nenul — un avertisment permanent e
           mobilier. `total` vine de la agent și NU se recalculează aici ca sumă:
           un anunț care așteaptă și descriere, și evaluare, se numără o dată. */
        const a=b.in_asteptare||{};
        if(a.total){
          const p=[];
          if(a.fara_descriere)p.push('fără descriere: '+a.fara_descriere);
          if(a.nenormalizate)p.push('nenormalizate: '+a.nenormalizate);
          if(a.neevaluate)p.push('neevaluate: '+a.neevaluate);
          h+='<div class="need" style="margin-top:10px">Briefingul e incomplet: '
            +(p.length?esc(p.join(', ')):a.total+' în așteptare')
            +'. Rulează din nou.</div>';}
        return h;};
      const stare=()=>{busy('Interoghez agentul…');
        fetch('/api/recon/stare').then(r=>r.json()).then(d=>{
          // Panoul tocmai a întrebat agentul: „viu" se scrie pe loc. Un eșec
          // se lasă sondei, care deosebește oprit, ocupat și eroare.
          if(d.ok)arataAgentul({viu:true});else sondaAgent();
          if(!d.ok){err(esc(d.eroare||'Agentul 051 nu răspunde.')
            +(d.detaliu?'<br><em>'+esc(d.detaliu)+'</em>':''));return;}
          const e=d.date.etape,c=d.date.cost||{};
          /* CÂND a lucrat ultima oară, primul rând. Cifrele de dedesubt sunt
             totaluri cumulate: arată identic fie că lanțul a rulat acum cinci
             minute, fie acum trei zile. Fără ceas, răspunsul corect „nimic nou"
             arată exact ca o unealtă moartă. */
          const ub=d.date.ultim_briefing;
          out.innerHTML=row('Ultimul briefing',ub?stamp(new Date(ub)):'niciodată',1)
            +row('Mailuri',e.mailuri)+row('Anunțuri',e.anunturi)
            +row('Normalizate',e.normalizate_ok,1)
            +row('Trec filtrul',e.filtrate_trece,1)
            +row('Respinse / incerte',e.filtrate_respins+' / '+e.filtrate_incert)
            /* CURENTE și VECHI, despărțite. Adunate, ascundeau exact ce despărțirea
               a făcut vizibil: verdictele rămase pe o versiune veche de criterii nu
               sunt o pierdere, sunt o listă de reevaluat. Adunate, un salt de
               versiune arăta ca o creștere. */
            +row('Evaluate calitativ',e.evaluate_calitativ_curente,1)
            +(e.evaluate_calitativ_vechi?row('— pe criterii vechi',e.evaluate_calitativ_vechi+' · de reevaluat'):'')
            +(e.versiune_criterii!=null?row('Versiune criterii',e.versiune_criterii):'')
            /* Cât din bază a fost chiar CITIT. Mult sub „Anunțuri" e răspunsul la
               „de ce atâtea incerte": un incert însemna „n-am citit anunțul", nu
               „anunț neclar". LinkedIn rămâne deliberat necitit. */
            +(e.cu_descriere!=null?row('Cu descriere',e.cu_descriere+' din '+e.anunturi,1):'')
            +(c.apeluri_total!=null?row('Apeluri model (total)',c.apeluri_total)+row('Tokeni (total)',c.tokeni_total):'');
        }).catch(()=>err('Serverul JA.S.Mine nu răspunde.'));};
      /* Un singur drum: joburile și delta se cer împreună, se desenează
         împreună. Două butoane ar fi însemnat că omul trebuie să știe pe care
         să apese ca să vadă ce a găsit agentul — exact ce n-are de ce să știe. */
      const brief=()=>{lock(true);busy('Cer joburile…');
        Promise.all([fetch('/api/recon/oportunitati?limita=12').then(r=>r.json()),
                     fetch('/api/recon/briefing').then(r=>r.json())])
          .then(([op,br])=>{if(esec(op))return;out.innerHTML=htmlDelta(br)+htmlJoburi(op);})
          .catch(()=>err('Serverul JA.S.Mine nu răspunde.')).finally(()=>lock(false));};
      /* Nu există buton „am citit", și n-are voie să reapară: ar sta în
         rezultatul rulării, deci singurul drum înapoi la el ar fi încă o rulare.
         O rulare nouă înseamnă implicit că ai citit. Reperul se mută pe
         server, la începutul rulării. */
      /* Ce se vede cât lucrează agentul: CE face și CE apare la sfârșit.
         CÂT ține nu se scrie: lanțul ține sub un minut, iar cronometrul de mai
         jos spune oricum cât a trecut — o durată promisă ar fi ori inutilă, ori
         o scuză. */
      const htmlProgres=()=>{
        const s=RECON_SECUNDE();
        return '<div class="need" style="margin-bottom:4px">Agentul lucrează. Nu s-a blocat.</div>'
          +'<div class="bara"><i></i></div>'
          +'<div class="hint">Citește mailurile noi din Gmail, le desface în anunțuri, '
          +'trage paginile celor care n-au text, și le trece prin filtre.</div>'
          +'<div class="hint" style="margin-top:8px">Când termină, <b>aici apare lista de '
          +'joburi</b>, cu firmă și link. Poți închide panoul cu Escape și te întorci — '
          +'rularea nu se oprește, iar rezultatul te așteaptă.</div>'
          +'<div class="hint" style="margin-top:8px">de <span id="recon-sec">'
          +Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'</span></div>';};
      const ticaie=()=>{
        clearInterval(RECON_STARE.tic);
        RECON_STARE.tic=setInterval(()=>{
          if(!RECON_STARE.pornit){clearInterval(RECON_STARE.tic);return;}
          const el=document.getElementById('recon-sec');
          if(!el)return;  // panoul e închis; rularea merge, ceasul o așteaptă
          const s=RECON_SECUNDE();
          el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
        },1000);};
      /* Rularea pornită de altcineva — de pagina dinainte de reîncărcare, de al
         doilea tab — nu ne lasă nicio promisiune de așteptat. Atunci întrebăm
         serverul din cinci în cinci secunde până tace, și cerem rezultatul ca
         la „Briefing". */
      const asteaptaSfarsitul=()=>{
        clearInterval(RECON_STARE.pandar);
        RECON_STARE.pandar=setInterval(()=>{
          fetch('/api/recon/ruleaza/stare').then(r=>r.json()).then(z=>{
            if(z&&z.ruleaza)return;
            clearInterval(RECON_STARE.pandar);clearInterval(RECON_STARE.tic);
            RECON_STARE.pornit=null;arataAgentul({viu:true});lock(false);
            brief();
          }).catch(()=>{});},5000);};
      const ruleaza=()=>{lock(true);
        RECON_STARE.pornit=Date.now();RECON_STARE.rezultat=null;
        // Harta e singurul semn care rămâne când panoul se închide.
        arataAgentul({lucreaza:true});
        out.innerHTML=htmlProgres();ticaie();
        let preluat=false;
        fetch('/api/recon/ruleaza',{method:'POST'}).then(r=>r.json()).then(d=>{
          /* „Rulează deja" NU e o eroare, e răspunsul corect la a doua apăsare.
             Ne agățăm de rularea care merge, cu ceasul ei, în loc să pornim a
             doua peste ea sau să arătăm un mesaj roșu care nu spune nimic. */
          if(d&&d.ruleaza_deja){
            preluat=true;
            RECON_STARE.pornit=Date.now()-(d.de_secunde||0)*1000;
            out.innerHTML=htmlProgres();ticaie();asteaptaSfarsitul();
            return null;}
          if(esec(d))return null;
          // Lanțul tocmai a produs date noi — joburile se cer după, nu înainte.
          return fetch('/api/recon/oportunitati?limita=12').then(r=>r.json()).then(op=>{
            if(esec(op))return;
            RECON_STARE.rezultat=htmlDelta(d)+htmlJoburi(op);
            arataRezultatul();});
        }).catch(()=>{err('Serverul JA.S.Mine nu răspunde. Nimic nu s-a marcat citit.');})
          .finally(()=>{
            // Dacă ne-am agățat de o rulare străină, ea încă merge: ceasul și
            // butoanele rămân cum sunt, iar paznicul de mai sus le eliberează.
            if(preluat)return;
            RECON_STARE.pornit=null;clearInterval(RECON_STARE.tic);
            arataAgentul({viu:true});lock(false);});};
      /* Rezultatul se desenează doar dacă panoul e încă deschis; altfel stă în
         RECON_STARE și îl găsești când te întorci. */
      const arataRezultatul=()=>{
        if(!document.body.contains(out))return;
        out.innerHTML=RECON_STARE.rezultat;};
      bSt.onclick=stare;bBr.onclick=brief;bRun.onclick=ruleaza;
      /* Ce vezi când deschizi panoul: rularea în curs bate rezultatul, care bate
         starea. Fără scara asta, un Escape dat în timpul rulării te aducea înapoi
         la panoul de pornire, ca și cum n-ar fi fost nimic — și de acolo apăsai
         a doua oară „Rulează", peste una care mergea deja. */
      if(RECON_STARE.pornit){lock(true);out.innerHTML=htmlProgres();ticaie();}
      else if(RECON_STARE.rezultat)arataRezultatul();
      else{
        /* Întrebăm SERVERUL dacă rulează ceva, nu doar memoria paginii: după o
           reîncărcare a punții, RECON_STARE e gol, dar lanțul poate fi în plină
           desfășurare. Fără rândul ăsta ai vedea butoanele libere și ai porni a
           doua rulare peste prima. */
        fetch('/api/recon/ruleaza/stare').then(r=>r.json()).then(z=>{
          if(z&&z.ruleaza){
            RECON_STARE.pornit=Date.now()-(z.de_secunde||0)*1000;
            lock(true);out.innerHTML=htmlProgres();ticaie();asteaptaSfarsitul();
          } else stare();
        }).catch(()=>stare());}
    }},

/* O bulă de manual arată exact ca o replică de chat: se citește la fel, nu ca
   o fișă. Eticheta de deasupra spune ce fel de lucru urmează, nu cine l-a spus;
   aici nu vorbește nimeni. */
function bulaMan(et,corp){
  const d=document.createElement('div');
  d.className='bula voce'+(RM?'':' apare');
  d.innerHTML='<div class="cine">'+et+'</div>'+corp;
  return d;
}
function faManual(k){
  const m=MANUALE[k];
  return {n:m.n,s:m.s,mare:true,
    html(){return '<div class="chat"><div class="msgs man" id="man-msgs"></div></div>';},
    wire(){
      const M=document.getElementById('man-msgs');
      if(!M)return;
      let i=0;
      // Bulele intră una câte una, ca un răspuns care se scrie. Fiecare pas
      // verifică întâi că panoul mai e în pagină: Escape îl poate închide la
      // jumătatea șirului, iar restul ar ateriza în fereastra următoare.
      const pune=()=>{
        if(!M.isConnected)return;
        if(i>=m.bule.length){if(m.viu)m.viu(M);return;}
        const b=m.bule[i++];
        M.appendChild(bulaMan(b[0],b[1]));
        // Fără derulare automată, spre deosebire de chat: acolo ce contează e
        // ultima replică, aici e prima propoziție. Un manual care se deschide
        // la coadă te pune să derulezi înapoi ca să afli de unde începe.
        setTimeout(pune,RM?0:150);
      };
      pune();
    }};
}

/* ── Chatul, o singură dată ──────────────────────────────────────────
   Socrate și Sky sunt două configurări ale aceleiași funcții, nu două copii.
   Diferă stratul, eticheta bulei, textul de așteptare — și starea, care e a
   fiecăruia. Restul (fereastra mare, lista, contorul, uneltele) e comun.

   Starea stă aici, pe strat: panourile se distrug la închidere, firele nu, iar
   comutarea între COMMAND și AGORA nu are voie să le amestece. */
const STARI={};

/* Cusătura dintre dictare și chat. Dictarea nu cunoaște panourile: știe doar
   că undeva există un câmp în care scrie și un buton pe care apasă.
   Se pune DOAR pentru stratul „sky" — Socrate nu primește ureche, iar asta
   trebuie să se vadă în cod, nu doar în document. */
let URECHE=null;   // {camp, trimite} cât panoul COMMAND e deschis, altfel null

function stareChat(strat){
  if(!STARI[strat])STARI[strat]={istoric:[],id:null,tokeni:0,titlu:'',inZbor:false,incheie:false};
  return STARI[strat];
}

/* Încheie firul: următoarea replică începe o conversație nouă.

   Starea trăiește în pagină, nu în panou, deci fără asta „disengage" ar
   ascunde doar ecranul: un fir viu reluat după o oră plătește la fiecare
   replică tot istoricul ca intrare.

   Nu se pierde nimic: firul e scris pe disc și se redeschide din listă. Se
   oprește doar continuarea automată.

   Dacă o replică e în zbor, răspunsul ei ar repopula starea DUPĂ golire — deci
   se cere încheierea, iar `finally` din trimite() o execută. */
function incheieFirul(strat){
  const st=stareChat(strat);
  if(st.inZbor){st.incheie=true;return;}
  st.istoric.length=0;st.id=null;st.tokeni=0;st.titlu='';st.incheie=false;
}

/* Tabelul de straturi vine de la server, din persona/straturi.json. Puntea nu
   cunoaște niciun id de model: trimite „sky" sau „socrate", iar serverul
   traduce. Eticheta bulei și textul de așteptare vin de acolo, nu din cod. */
let STRATURI=null;
function cereStraturi(){
  return fetch('/api/straturi').then(r=>r.json())
    .then(d=>{STRATURI=(d&&typeof d==='object')?d:null;})
    .catch(()=>{STRATURI=null;});
}

function faChat(strat){
  return {
  mare:true,
  html(){
    // Fără tabelul de straturi nu se poate desena nimic: n-am nici eticheta, nici
    // textul de așteptare. Panoul o spune, nu rămâne alb — precedentul RECON.
    if(!(STRATURI&&STRATURI[strat]))
      return '<div class="need">Nu pot citi lista de straturi.<br>'
        +'<em>GET /api/straturi nu răspunde. Serverul JA.S.Mine pornește doar cu '
        +'persona/straturi.json valid — vezi consola lui.</em></div>';
    // Id-urile sunt aceleași la ambele panouri — în sheet trăiește unul singur
    // la un moment dat, deci nu se ciocnesc. Ce se poate ciocni sunt cererile
    // rămase în zbor de la panoul dinainte; de-aia fiecare callback verifică
    // mai jos că elementul lui mai e în pagină.
    return '<div class="chat">'
      +'<div class="chat-bar">'
        +'<span class="chat-tit" id="c-tit"></span>'
        +'<span class="chat-tok" id="c-tok"></span>'
        +'<button class="btn doar-ingust" id="c-lista-btn" style="padding:6px 11px">Conversații</button>'
        +'<button class="btn" id="c-nou" style="padding:6px 11px">Conversație nouă</button>'
      +'</div>'
      +'<div class="chat-lung" id="c-lung" hidden>conversație lungă — ia în calcul una nouă</div>'
      +'<div class="chat-mij">'
        +'<div class="lista" id="c-lista">'
          +'<div class="lista-nota" id="c-nota" hidden></div>'
          +'<div id="c-randuri"></div>'
        +'</div>'
        +'<div class="msgs" id="c-msgs"></div>'
      +'</div>'
      +'<div class="compune">'
        +'<textarea id="c-in" placeholder="Întreabă. Enter trimite, Shift+Enter rând nou."></textarea>'
        +'<button class="btn" id="c-go" style="padding:0 17px">Trimite</button>'
      +'</div>'
    +'</div>';},
    wire(){
      const descriere=STRATURI&&STRATURI[strat];
      if(!descriere){
        // Poate răspunsul de la /api/straturi n-a ajuns încă la prima deschidere.
        // Mai încerc o dată; dacă vine, redesenez panoul. Altfel rămâne mesajul
        // din html() — o singură reîncercare, nu o buclă pe un server căzut.
        cereStraturi().then(()=>{if(STRATURI&&STRATURI[strat]&&selected)openPanel(selected);});
        return;}
      const M=document.getElementById('c-msgs'),I=document.getElementById('c-in'),
            B=document.getElementById('c-go'),T=document.getElementById('c-tok'),
            TT=document.getElementById('c-tit'),LG=document.getElementById('c-lung'),
